# Xcode project definition. Regenerate the .xcodeproj with:  xcodegen generate   (brew install xcodegen)
name: Ruinaccord
options:
  bundleIdPrefix: com.hermes-eris
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "2.6.31"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "7Z6WNXV55C"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    OTHER_LDFLAGS: ["-ObjC"]
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.0.0"
targets:
  Ruinaccord:
    type: application
    platform: iOS
    sources:
      - path: Ruinaccord
        excludes:
          - "Resources/GoogleService-Info.plist.example"
    info:
      path: Ruinaccord/Info.plist
      properties:
        CFBundleDisplayName: Ruinaccord
        CFBundleLocalizations: [en, zh-Hans, ja]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.card-games
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiredDeviceCapabilities: [arm64]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        # Landscape only (like the duel); iPad needs full screen when it does not support every orientation.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: true
        FirebaseAutomaticScreenReportingEnabled: false
    entitlements:
      path: Ruinaccord/Ruinaccord.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hermes-eris.ruinaccord
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
      configs:
        # Archives (scripts/testflight.sh or Product > Archive) sign manually for the App Store.
        # Set here rather than on the xcodebuild command line, which would also apply to the
        # Firebase package targets, and those cannot take a provisioning profile.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Ruinaccord App Store
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
  RuinaccordTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RuinaccordTests]
    dependencies:
      - target: Ruinaccord
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hermes-eris.ruinaccord.tests
        GENERATE_INFOPLIST_FILE: YES
