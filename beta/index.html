<link rel="manifest" href="manifest.webmanifest">

<style>
/* Layout: one-screen duel — top bar, enemy hero, enemy board, play history, log, your board, your hero, hand, end-turn bar.
   Single committed look: torchlit dungeon stone, parchment cards, ember and arcane accents. */
:root{
  color-scheme:dark;
  --bg:#141118; --panel:#221b26; --line:#3d3244;
  --ink:#ece3d0; --muted:#a69ba6;
  --parch:#efe2c2; --parch-ink:#2b2219;
  --ember:#e2763a; --kelp:#6aa57e; --foam:#a9c4ff; --gold:#d9b45a; --blood:#cf4a3f; --ready:#7fd17f; --arcane:#8f78e0;
  --display:"IM Fell English SC", "Noto Serif SC", "Noto Serif JP", "Songti SC", "Hiragino Mincho ProN", Georgia, serif;
  --body:"Alegreya Sans", "PingFang SC", "Hiragino Sans GB", "Hiragino Sans", "Yu Gothic", "Microsoft YaHei", "Meiryo", system-ui, sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;overflow-x:hidden;
  background-image:radial-gradient(110% 55% at 50% 45%, #2a2030 0%, transparent 70%)}
.embers{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.embers i{position:absolute;bottom:-12px;border-radius:50%;background:#f39a3a;box-shadow:0 0 6px 1px rgba(243,154,58,.7);animation:rise linear infinite;opacity:.7}
/* A painted place behind each duel, darkened where the cards sit: a wash over the picture, a deeper pool over
   the board, shaded edges, so gems and rules text keep their contrast. */
body[data-scene]{background:#0a0710}
body[data-scene]::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;filter:saturate(.9);
  background:linear-gradient(180deg,rgba(6,4,10,.35),rgba(6,4,10,0) 20%,rgba(6,4,10,0) 65%,rgba(6,4,10,.55)),
    linear-gradient(90deg,rgba(6,4,10,.7),rgba(6,4,10,0) 10%,rgba(6,4,10,0) 90%,rgba(6,4,10,.7)),
    radial-gradient(ellipse at 50% 50%,rgba(10,7,16,.62) 0%,rgba(10,7,16,.5) 45%,rgba(10,7,16,0) 100%),
    rgba(10,7,16,.32),var(--scene) center/cover no-repeat}
body[data-scene=graveyard]{--scene:url(img/bg/graveyard.jpg)}
body[data-scene=dawn]{--scene:url(img/bg/dawn.jpg)}
body[data-scene=warfront]{--scene:url(img/bg/warfront.jpg)}
body[data-scene=glade]{--scene:url(img/bg/glade.jpg)}
@keyframes rise{0%{transform:translate(0,0)}50%{opacity:.8}100%{transform:translate(var(--dx),-108vh);opacity:0}}
#app{position:relative;z-index:1;min-height:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:6px;box-sizing:border-box;
  padding-block:8px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.top{display:flex;align-items:center;gap:8px}
.brand{font-family:var(--display);font-size:21px;letter-spacing:.04em;color:var(--parch);flex:1;white-space:nowrap}
:is(:lang(zh),:lang(ja)) .brand{font-weight:600;font-size:19px}
.pill{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel);padding:0;font-size:12px;font-weight:700}
.pill span{padding:4px 9px;color:var(--muted)}
.langsel{appearance:none;-webkit-appearance:none;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--parch);
  font:700 12px var(--body);padding:4px 22px 4px 10px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 12px) 52%,calc(100% - 8px) 52%;background-size:4px 4px;background-repeat:no-repeat}
.langsel:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.langsel option{background:var(--panel);color:var(--ink)}
.stagepill{font-size:12px;font-weight:800;color:var(--ember);border:1.5px solid var(--ember);border-radius:999px;padding:2px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.routerow{display:flex;justify-content:center;padding-top:4px}
.route{display:flex;align-items:center;gap:3px}
.node{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:10px;font-weight:800;color:var(--muted)}
.node.done{background:var(--line);color:var(--ink)}
.node.here{border-color:var(--ember);color:var(--ember)}
.link{width:6px;height:1.5px;background:var(--line)}

.hero{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.face{position:relative;flex:none;width:50px;height:50px;border-radius:50%;border:2px solid #5a4a6a;
  background:radial-gradient(circle at 40% 35%, #4a3a5a, #1b1422);display:grid;place-items:center;font-family:var(--display);font-size:18px;padding:0}
.hero.foe .face{background:radial-gradient(circle at 40% 35%, #5a2a26, #1e0e0c);border-color:#6d3a33}
.hpb{position:absolute;right:-8px;bottom:-6px;min-width:24px;height:24px;border-radius:12px;background:var(--blood);color:#fff;font:800 13px var(--body);display:grid;place-items:center;padding:0 4px;font-variant-numeric:tabular-nums}
.arb{position:absolute;left:-8px;bottom:-6px;min-width:22px;height:22px;border-radius:6px;background:#5e6670;color:#fff;font:800 12px var(--body);display:grid;place-items:center}
.hinfo{flex:1;min-width:0;display:grid;gap:3px}
.hname{font-family:var(--display);font-size:17px;color:var(--parch);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
:is(:lang(zh),:lang(ja)) .hname{font-weight:600;font-size:16px}
.meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.crystals{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.crystals i{width:9px;height:12px;transform:skewX(-12deg);border-radius:2px;background:#2a2234;border:1px solid #3d3150;transition:background .3s}
.crystals i.on{background:#5aa3e0;border-color:#8cc4f0}
.crystals b{font-size:12px;margin-left:4px;color:#8cc4f0;font-variant-numeric:tabular-nums}
.crystals .sm{display:inline-flex;gap:2px;margin-left:6px}
.smb{display:inline-flex;align-items:center;gap:3px;margin-left:8px;padding:1px 7px;border-radius:999px;border:1px solid #a77be8;background:#2a1f3a;color:#d2b8ff;font-size:11px;font-weight:700;white-space:nowrap}
.smb i{width:7px;height:7px;transform:rotate(45deg);border-radius:1px;background:#2a2234;border:1px solid #6a5590}
.smb i.on{background:#a77be8;border-color:#d2b8ff}
.smb b{font-size:11px;margin-left:2px;color:#d2b8ff}
.smb.zero{opacity:.6}
.lsm.bsm{height:auto;margin-top:2px;display:flex;align-items:center;gap:2px;flex-wrap:wrap;justify-content:center}.lsm.bsm i.off{opacity:.3}.lsm.bsm b{font-size:9px;color:#d2b8ff;margin-left:2px}
.crystals .sm i{width:8px;height:8px;transform:rotate(45deg);border-radius:1px;background:#a77be8;border:1px solid #d2b8ff}
.power{flex:none;width:58px;height:58px;border-radius:50%;border:2px solid var(--gold);background:radial-gradient(circle at 40% 35%, #4a3a2a, #1e160f);
  font-size:10px;font-weight:700;line-height:1.15;display:grid;place-items:center;text-align:center;padding:4px;position:relative}
.power.foe{border-color:#6d3a33;opacity:.75}
.power .pc{z-index:1;position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;background:#2f6fa8;color:#fff;font-size:11px;display:grid;place-items:center}
.power .pn{display:block;max-width:50px}
.power[disabled]{opacity:.4;cursor:default}
.power:not([disabled]):not(.foe){animation:glowP 2s ease-in-out infinite}
@keyframes glowP{50%{box-shadow:0 0 12px rgba(217,180,90,.6)}}

.board{display:flex;justify-content:center;align-items:center;gap:8px;min-height:98px;padding:4px 0}
.board.empty::after{content:attr(data-empty);font-size:12px;color:var(--muted);opacity:.6}
.min{position:relative;width:60px;height:84px;flex:none;border-radius:14px 14px 10px 10px;border:2px solid #5a4a6a;
  background:linear-gradient(#3a3046,#211b29);display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 3px 0;transition:transform .15s}
.min.e{background:linear-gradient(#4a2826,#24130f);border-color:#6d3a33}
.mart{display:block;width:100%;height:32px;border-radius:10px 10px 4px 4px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#5a4636,#17110d)}
.mart svg{width:100%;height:100%;display:block}
.min.guard{border:3px solid var(--gold);border-radius:6px}
.min.guard .mart{border-radius:3px}
.min.ward{box-shadow:0 0 0 3px rgba(169,196,255,.6),0 0 14px rgba(169,196,255,.55);animation:wardPulse 2.4s ease-in-out infinite}
@keyframes wardPulse{50%{box-shadow:0 0 0 4px rgba(169,196,255,.35),0 0 20px rgba(169,196,255,.7)}}
.min.sleep{filter:saturate(.6) brightness(.85)}
.min.frozen{box-shadow:0 0 0 3px rgba(143,208,255,.85),inset 0 0 18px rgba(143,208,255,.55);filter:saturate(.7) hue-rotate(10deg)}
.min.silenced .mart{filter:grayscale(.85)}
.min.ready{outline:2px solid var(--ready);outline-offset:2px}
.min.sel{transform:translateY(-8px);outline:2px solid var(--ember);outline-offset:2px}
.min.enter{animation:enter .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes enter{from{transform:translateY(-36px) scale(.4);opacity:0}}
.target{outline:2px solid var(--blood)!important;outline-offset:2px;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{outline-color:transparent}}
.hit{animation:hit .38s ease-out}
@keyframes hit{20%{transform:translateX(-5px);filter:brightness(1.6) sepia(.6) saturate(3) hue-rotate(-30deg)}55%{transform:translateX(4px)}80%{transform:translateX(-2px)}}
.mn{font-size:9.5px;line-height:1.05;text-align:center;font-weight:800;overflow:hidden;max-height:20px}
.kw{font-size:8px;line-height:1.1;color:var(--gold);text-transform:uppercase;letter-spacing:.05em;text-align:center}
.z{position:absolute;top:-9px;right:-4px;font-size:11px;font-weight:800;color:var(--muted);animation:zz 1.6s ease-in-out infinite}
@keyframes zz{50%{transform:translateY(-3px);opacity:.5}}
.st{position:absolute;bottom:-8px;width:24px;height:24px;display:grid;place-items:center;font-size:12px;font-weight:900;color:#fff8e6;font-variant-numeric:tabular-nums;z-index:2;
  background:no-repeat center/100% 100%;filter:drop-shadow(0 1px 2px rgba(0,0,0,.8));
  text-shadow:-.06em 0 var(--ink2),.06em 0 var(--ink2),0 -.06em var(--ink2),0 .06em var(--ink2),0 .1em .15em rgba(0,0,0,.6)}
.st.a{left:-8px;--ink2:#3a1c06;background-image:var(--gem-atk)}
.st.h{right:-8px;height:26px;padding-bottom:1px;--ink2:#3a0a06;background-image:var(--gem-hp)}
.st.h.hurt{color:#ffb3a9}
.st.h.up,.st.a.up{color:#9fe09f}

.mid{display:flex;align-items:center;justify-content:center;gap:10px;min-height:28px;font-size:13px;color:var(--muted);text-align:center}
.mid .btn{padding:5px 12px;font-size:12px}
.float{position:absolute;left:50%;top:-18px;transform:translateX(-50%);font-weight:800;font-size:20px;pointer-events:none;text-shadow:0 1px 3px #000;animation:up .9s ease-out forwards;white-space:nowrap;z-index:5}
@keyframes up{0%{transform:translateX(-50%) scale(1.5)}20%{transform:translateX(-50%) scale(1)}to{opacity:0;top:-48px}}

/* ---------- card face (sized in em; .sm hand, .md reward/reveal, .big gallery) ----------
   Full-art layout: the painting is the whole card, rules sit in a translucent box at the bottom. */
.card{position:relative;flex:none;width:10em;height:15.6em;padding:0;border:.28em solid #8a6a3a;border-radius:.9em;font-size:9.4px;
  background:#120d16;color:#f3e9d4;display:block;box-shadow:0 .25em 0 #0009;text-align:center;font-family:var(--body);transition:transform .15s}
.card.s{border-color:#6c58b8}
.card.leg{border-color:#e8b24a}.card.uniq{border-color:#a35ad6}
/* Every laid-out card keeps the same room around itself for the painted frames' ornaments (medallion above, cloth
   on the left), so framed and plain cards take one slot size and never crowd each other or the chrome. */
.coll,.gal,.picks,.pcards,.mcards{padding-top:2.7em;padding-left:2.1em}.lprev .card{margin:2.7em 1em .8em 2.1em}
.coll{font-size:9.4px}.gal{font-size:14px}.picks,.pcards{font-size:10.8px}.mcards{font-size:10.8px}
/* Legendaries wear the painted gold frame, one-copy class epics the purple one (img/frame_*.png, cut out in the
   middle). Its opening sits on the card's edge (a quarter em in), so the ornaments hang outside and cover neither
   the art nor the rules; sizes come from the opening geometry art/frames/build_frames.py prints. */
.card.leg::before,.card.uniq::before{content:"";position:absolute;background:url(img/frame_gold.png) center/100% 100% no-repeat;pointer-events:none;z-index:1;
  width:13.51em;height:20.44em;left:-2.24em;top:-2.88em}
.card.uniq::before{background-image:url(img/frame_purple.png);width:13.92em;height:20.85em;left:-2.44em;top:-2.62em}
/* The cost gem sits on the frame's medallion (its own em is 1.2 card em, width 2.4 of them). */
.card.leg .cost{left:0.23em;top:-1.47em}
.card.uniq .cost{left:-0.43em;top:-1.32em}
.card.md{font-size:10.8px}.card.big{font-size:14px}
.card .art{position:absolute;inset:0;border-radius:.62em;overflow:hidden;background:radial-gradient(circle at 50% 28%,#5a4636,#120d16 72%)}
.card.s .art{background:radial-gradient(circle at 50% 28%,#3d2f6e,#100a20 72%)}
.card.leg .art{background:radial-gradient(circle at 50% 28%,#6a2a1a,#1a0806 72%)}
.card .art svg{position:absolute;left:0;top:.45em;width:100%;height:auto;aspect-ratio:100/64;display:block}
.card .art img{width:100%;height:100%;object-fit:cover;display:block}
/* Number gems ride on the corners of the card, a little past its edge. Painted stones: flat facets, an ink
   outline, a thin inner line, a brush dab of light and a grain of paint. Cost is a blue hexagon, Attack an
   amber diamond, Health a polished red shield. */
/* Painted number gems (cost, attack, health) shared by hand cards and board minions. */

.card .cost,.card .stat{position:absolute;display:grid;place-items:center;z-index:2;font-weight:900;color:#fff8e6;font-variant-numeric:tabular-nums;
  background:no-repeat center/100% 100%;filter:drop-shadow(0 .08em .15em rgba(0,0,0,.8));
  text-shadow:-.06em 0 var(--ink2),.06em 0 var(--ink2),0 -.06em var(--ink2),0 .06em var(--ink2),0 .1em .15em rgba(0,0,0,.6)}
.card .cost{top:-.65em;left:-.65em;width:2.4em;height:2.4em;font-size:1.2em;--ink2:#0c1a36;
  background-image:var(--gem-cost)}
.card .tbox{position:absolute;left:.35em;right:.35em;bottom:.35em;min-height:40%;display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:.18em;
  background:rgba(14,10,18,.66);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);border:.08em solid rgba(232,195,90,.35);
  border-radius:.5em;padding:.85em .55em 1.25em;line-height:1.22;color:#f3e9d4}
.card.s .tbox{padding-bottom:.55em}
.card .plate{font-family:var(--display);font-size:1.12em;line-height:1.1;color:#fff4dc;text-shadow:0 .08em .2em #000}
:is(:lang(zh),:lang(ja)) .card .plate{font-weight:600;font-size:1.04em;line-height:1.25}
.card .gem{position:absolute;top:-.42em;left:50%;margin-left:-.375em;width:.75em;height:.75em;transform:rotate(45deg);border:.1em solid #0009}
.rchip{padding:0 .7em;min-width:2.2em}.rchip .gem{position:static;display:block;margin:0 auto;width:.7em;height:.7em;opacity:.75}.rchip.on .gem{opacity:1;width:.85em;height:.85em;box-shadow:0 0 .45em currentColor}
.gem.c{background:#e8e4da}.gem.r{background:#4f8fe0}.gem.e{background:#a35ad6}.gem.l{background:#f09a3a;box-shadow:0 0 .4em #f09a3a}.gem.t{background:#a69ba6}
.card .typ{font-size:.68em;letter-spacing:.1em;text-transform:uppercase;color:#9fc4ee}
.card .tx{font-size:.86em;line-height:1.24;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.lprev .card .tx,.peek .card .tx{display:block;-webkit-line-clamp:unset;overflow:visible}
.card .tx b{font-weight:800;color:#ffe2a0}
.card .stat{bottom:-.65em;width:2.3em;height:2.3em;font-size:1.25em}
.card .stat.a{left:-.65em;--ink2:#3a1c06;
  background-image:var(--gem-atk)}
.card .stat.h{right:-.65em;height:2.46em;padding-bottom:.1em;--ink2:#3a0a06;
  background-image:var(--gem-hp)}
.mart img,.hchip img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
.card.leg::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,transparent 35%,rgba(255,240,200,.35) 50%,transparent 65%);background-size:250% 100%;animation:shine 3.2s linear infinite}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}

.hand{display:flex;gap:7px;overflow-x:auto;padding:26px 10px 16px 20px;margin-inline:-6px;scrollbar-width:thin}
.hand .card.play{box-shadow:0 0 0 .22em var(--ready),0 0 .9em rgba(127,209,127,.5),0 .25em 0 #0009}
.hand .card.play:hover,.hand .card.play:active{transform:translateY(-6px)}
.hand .card.off{filter:grayscale(.5) brightness(.65)}
.hand .card.pend{transform:translateY(-10px);box-shadow:0 0 0 .22em var(--ember),0 0 1em rgba(226,118,58,.6)}
.hand .card.drawn{animation:drawIn .45s cubic-bezier(.2,1.2,.4,1) backwards;animation-delay:var(--d,0ms)}
@keyframes drawIn{from{transform:translateX(80px) rotate(10deg);opacity:0}}

.foot{display:flex;align-items:center;gap:10px}
.foot .meta{flex:1}
.btn{background:var(--ember);color:#2a130a;border:none;border-radius:8px;padding:11px 18px;font-weight:800;font-size:15px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.glow{animation:glowB 1.4s ease-in-out infinite}
@keyframes glowB{50%{box-shadow:0 0 0 3px var(--ready),0 0 14px rgba(127,209,127,.6)}}
.btn[disabled]{opacity:.45;cursor:default}

.screen{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;text-align:center;padding-block:20px;animation:fadeUp .4s ease-out}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}
.screen h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0;color:var(--parch);text-wrap:balance}
:is(:lang(zh),:lang(ja)) .screen h2{font-weight:600;font-size:26px}
.screen p{margin:0 auto;color:var(--muted);max-width:44ch;line-height:1.5}
.rules{text-align:left;margin:0 auto;max-width:44ch;display:grid;gap:6px;padding:0;list-style:none;font-size:14px;line-height:1.5}
.rules li{padding-left:14px;position:relative}
.rules li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--ember)}
.rules b{color:var(--parch)}
.picks{display:flex;gap:2.9em;justify-content:center;flex-wrap:wrap;padding-top:8px}
.picks .card:hover{transform:translateY(-6px)}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.fan{display:flex;justify-content:center;height:160px;margin-top:6px;overflow-x:clip;max-width:100%}
.fan .card{margin:0 -16px;transform-origin:50% 140%}

.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;width:100%;margin:0 auto;text-align:left}
.ccard{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;
  border-top:3px solid var(--cc);transition:transform .15s,border-color .15s;animation:fadeUp .35s ease-out backwards}
.ccard:hover{transform:translateY(-2px);border-color:var(--cc)}
.ccard:nth-child(2){animation-delay:.05s}.ccard:nth-child(3){animation-delay:.1s}.ccard:nth-child(4){animation-delay:.15s}.ccard:nth-child(5){animation-delay:.2s}.ccard:nth-child(6){animation-delay:.25s}
.cport{flex:none;width:64px;height:64px;border-radius:50%;overflow:hidden;border:2px solid var(--cc);background:radial-gradient(circle at 50% 40%,#3a3046,#140f18)}
.cport svg,.fart svg,.cport img,.fart img{width:100%;height:100%;display:block;object-fit:cover}
.ctext{display:grid;gap:4px;min-width:0}
.cname{font-family:var(--display);font-size:20px;color:var(--parch);line-height:1.1}
:is(:lang(zh),:lang(ja)) .cname{font-weight:600;font-size:18px}
.hintro{text-align:center}.cport.big{width:160px;height:160px;margin:0 auto 6px;border-width:3px}
.iblock{display:grid;gap:4px;text-align:left;max-width:520px;margin:10px auto 0;padding:12px 14px;border:1px solid color-mix(in srgb,var(--cc) 55%,transparent);border-radius:12px;background:var(--panel)}
.iblock .ilbl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.iblock b{font-family:var(--display);font-size:18px;color:var(--cc)}.iblock.pw b{color:#9fc4ee}.iblock span:last-child{font-size:13.5px;line-height:1.45}
.hintro .btn{margin-top:14px}
.chero{font-size:11.5px;font-weight:700;color:var(--gold);line-height:1.3}
.ctag{font-size:12.5px;color:var(--muted);line-height:1.35}
.cpow{display:flex;gap:8px;align-items:flex-start;margin-top:2px;font-size:13px;line-height:1.35}
.cpow .pc{flex:none;width:20px;height:20px;border-radius:50%;background:#2f6fa8;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;margin-top:1px}
.cpow b{color:var(--parch)}
.fart{position:absolute;inset:0;border-radius:50%;overflow:hidden}
.pcur b{color:var(--parch)}

/* ---------- menu, deck builder, difficulty ---------- */
.nav{display:flex;gap:8px;flex-wrap:wrap;padding-top:6px}
.dklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;width:100%;text-align:left}
.dk{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--cc);border-radius:12px;padding:12px}
.dk .cport{width:52px;height:52px}
.dkt{display:grid;gap:2px;min-width:0}
.dkt b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--parch);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
:is(:lang(zh),:lang(ja)) .dkt b{font-weight:600;font-size:16px}
.dkt span{font-size:12.5px;color:var(--muted)}
.dkt span.warn{color:var(--ember)}
.dkb{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.dkb .btn{padding:7px 12px;font-size:13px}
.btn.danger{border-color:var(--blood);color:#f0a097}
.namebar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.namebar input{flex:1;min-width:150px;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--parch);font:600 15px var(--body);padding:9px 11px;-webkit-user-select:text;user-select:text}
.namebar input:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.namebar .btn{padding:9px 12px;font-size:13px}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:22px;color:var(--muted);font-size:14px;line-height:1.5}
.nav .btn{padding:6px 12px;font-size:13px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;width:100%;max-width:640px;margin:0 auto}
.room{box-sizing:border-box;display:grid;gap:8px;justify-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;width:100%;max-width:420px;margin:0 auto}
.room .code{font:700 40px/1.1 var(--display);letter-spacing:.12em;color:var(--gold);-webkit-user-select:all;user-select:all}
.room p{margin:0}
.chip.odeck{border-left:3px solid var(--cc);font-size:12.5px;padding:6px 11px}
.netwarn{position:fixed;left:50%;top:calc(8px + env(safe-area-inset-top));transform:translateX(-50%);background:#3a1f1a;border:1px solid var(--ember);color:var(--parch);padding:6px 12px;border-radius:999px;font-size:12.5px;z-index:40;white-space:nowrap}
.hres{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:3px}
.ember{font-size:11.5px;font-weight:700;color:#ffb070;background:#3a1f14;border:1px solid #8a4a2a;border-radius:999px;padding:1px 8px;white-space:nowrap}
.altar{display:inline-flex;gap:4px}
.aslot{position:relative;display:inline-block;width:34px;height:23px;border-radius:6px;border:1px solid #e8c35a99;background:#2a2430;padding:0;overflow:hidden}
.aslot svg,.aslot img{width:100%;height:100%;display:block;object-fit:cover}
.aslot b{position:absolute;right:1px;bottom:1px;background:#e8c35a;color:#141118;font-size:11px;border-radius:4px;padding:0 3px;line-height:13px}
.aslot.empty{border-style:dashed;opacity:.45}
.lhero .hres{justify-content:center;margin-top:4px}.lhero .ember{font-size:10px;padding:0 5px}.lhero .aslot{width:26px;height:18px}
.card.ign{box-shadow:0 0 0 2px #ff8a3a,0 0 14px #ff8a3aaa}
.hboost{position:absolute;top:-.5em;right:-.4em;z-index:2;background:#ff8a3a;color:#2a130a;font-weight:800;font-size:.95em;border-radius:999px;padding:0 .45em;line-height:1.5em}
.card .cost.down{color:#9fe09f}.card .cost.up{color:#ffb3a9}.card .stat.up{color:#9fe09f}
.ctr{font-size:11px;font-weight:700;color:#ffd0a0;background:#3a2414;border:1px solid #8a5a2a;border-radius:999px;padding:1px 7px;white-space:nowrap}
.lhero .ctr{font-size:9.5px;padding:0 4px}
.talbtn{font-size:11.5px;font-weight:800;color:var(--gold);background:#2a2430;border:1px solid #e8c35a88;border-radius:999px;padding:1px 8px;line-height:18px}
.lhero .talbtn{font-size:10px;padding:0 5px}
.talp{display:grid;gap:10px;width:100%}
.talhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.talpages{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.talpages{grid-template-columns:1fr}}
.tpage{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--tc);border-radius:12px;padding:10px;display:grid;gap:8px;min-width:0}
.tpage h3{margin:0;font-size:15px;display:flex;justify-content:space-between;color:var(--tc)}
.tpage h3 span{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.trow{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px}
.treq{grid-column:1/-1;font-size:11px;color:var(--muted);text-align:left}
.tnode{display:grid;gap:3px;align-content:start;text-align:left;border:1px solid var(--line);background:#1e1922;color:var(--parch);border-radius:9px;padding:7px 8px;min-width:0}
.tnode b{font-size:12.5px}.tnode span{font-size:11px;color:var(--muted);line-height:1.35}
.tnode.on{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 18%,#1e1922);box-shadow:0 0 0 1px var(--tc) inset}
.tnode.on b{color:var(--tc)}
.tnode.lock{opacity:.42}
.trow.cap .tnode{border-style:dashed}.trow.cap .tnode.on{border-style:solid}
.packs{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:760px}
@media (max-width:640px){.packs{grid-template-columns:1fr}}
.pack{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--tc);border-radius:12px;padding:10px;display:grid;gap:8px;justify-items:center}
.pack h3{margin:0;color:var(--tc);font-size:16px}
.pcards{display:flex;gap:2.9em;justify-content:center}
.phint{margin:0;font-size:12.5px;color:var(--muted);text-align:center}.phint b{color:var(--tc)}
.tvl{list-style:none;margin:0;padding:0;display:grid;gap:6px;text-align:left;max-width:460px}
.tvl li{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--tc);border-radius:8px;padding:6px 9px;font-size:12.5px}
.tvl li b{color:var(--tc);margin-right:6px}
.foot .concede{padding:7px 10px;font-size:12.5px}
.mode{display:grid;gap:4px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;border-left:4px solid var(--cc,var(--ember));transition:transform .15s}
.mode:hover{transform:translateY(-2px)}
.mode b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--parch)}
:is(:lang(zh),:lang(ja)) .mode b{font-weight:600;font-size:18px}
.mode span{font-size:13px;color:var(--muted);line-height:1.4}
.bhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:6px}
.bhead h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0;color:var(--parch);flex:1;min-width:0}
:is(:lang(zh),:lang(ja)) .bhead h2{font-weight:600;font-size:21px}
.count{font-weight:800;font-variant-numeric:tabular-nums;border:1.5px solid var(--ember);color:var(--ember);border-radius:999px;padding:3px 10px;font-size:13px;white-space:nowrap}
.count.ok{border-color:var(--ready);color:var(--ready)}
.bnote{font-size:12.5px;color:var(--muted);margin:0;line-height:1.45}

.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(10em,1fr));gap:3.5em 2.9em;justify-items:center;padding-bottom:20px}
.cslot{position:relative}

.cslot.clsc .card{box-shadow:0 0 0 .22em var(--cc),0 0 .8em color-mix(in srgb,var(--cc) 55%,transparent),0 .25em 0 #0009}

.bfoot{position:sticky;bottom:0;z-index:5;display:flex;gap:10px;align-items:center;justify-content:space-between;background:linear-gradient(transparent,var(--bg) 30%);
  padding-top:18px;padding-bottom:max(8px,env(safe-area-inset-bottom,0px))}
.toast{min-height:18px;font-size:12.5px;color:var(--ember)}

/* ---------- gallery ---------- */
.ghead{display:flex;align-items:center;gap:12px;padding-top:6px}
.ghead h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0;color:var(--parch);flex:1}

.gsec{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:14px 0 2px;font-weight:800}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(10em,1fr));gap:2.9em 2.9em;padding:12px 0 24px}
.gitem{display:grid;justify-items:center;gap:8px;min-width:0}
.gmeta{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.flav{margin:0;font-size:12.5px;font-style:italic;line-height:1.4;color:#c4b9c0;text-align:center;max-width:15em}

/* ---------- effect layers ---------- */
.orb{position:fixed;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,#fff 15%,var(--c) 50%,transparent 72%);box-shadow:0 0 16px 5px var(--c);z-index:30;pointer-events:none}
.burst{position:fixed;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:3px solid var(--c,#f3c97a);pointer-events:none;z-index:30}
.spark{position:fixed;border-radius:50%;background:#f39a3a;box-shadow:0 0 6px #f39a3a;pointer-events:none;z-index:30}
.flash{position:fixed;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;background:radial-gradient(circle,#fff 0%,rgba(255,220,200,.7) 40%,rgba(255,255,255,0) 70%);pointer-events:none;z-index:31}
.shard{position:fixed;border-radius:2px;box-shadow:0 0 4px rgba(0,0,0,.6);pointer-events:none;z-index:31}
.face.dead{animation:facedie .75s .15s ease-in forwards}
@keyframes facedie{0%{transform:scale(1)}15%{transform:scale(1.1) translate(-3px,0);filter:brightness(1.4) saturate(.4)}30%{transform:scale(1.16) translate(3px,0);filter:brightness(1.8) saturate(.2)}100%{transform:scale(1.55);opacity:0;filter:brightness(2.5)}}
@media (prefers-reduced-motion:reduce){.face.dead{animation:none;opacity:.35}}
.wave{position:fixed;border-radius:12px;pointer-events:none;z-index:30;background:linear-gradient(90deg,transparent,rgba(243,154,58,.65),transparent);background-size:45% 100%;background-repeat:no-repeat}
.banner{position:fixed;left:0;right:0;top:40%;z-index:40;pointer-events:none;text-align:center;font-family:var(--display);font-size:30px;color:var(--parch);
  padding:12px 0;background:linear-gradient(90deg,transparent,rgba(20,17,24,.94) 22%,rgba(20,17,24,.94) 78%,transparent);border-block:1.5px solid var(--gold)}
:is(:lang(zh),:lang(ja)) .banner{font-weight:600;letter-spacing:.2em}
.banner.foe{border-color:var(--blood);color:#f0b0a6}
.reveal{position:fixed;left:50%;top:12%;z-index:35;pointer-events:none;filter:drop-shadow(0 10px 24px #000c);transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:8px}
.rcap,.rtgt{font-size:13px;font-weight:800;padding:3px 12px;border-radius:999px;white-space:nowrap}
.rcap{color:#f0b0a6;background:rgba(20,17,24,.92);border:1px solid #7a3f39}
.reveal.me .rcap,.peek .rcap.me{color:var(--ready);border-color:var(--kelp)}
.rtgt{color:#fff;background:rgba(207,74,63,.9)}
.aimed{outline:3px solid var(--blood)!important;outline-offset:3px;box-shadow:0 0 18px rgba(207,74,63,.85)!important;animation:pulse .5s ease-in-out infinite}
.hist{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;min-height:30px}
.hlab{font-size:11px;color:var(--muted);margin-right:4px}
.hchip{width:30px;height:30px;padding:0;border-radius:7px;overflow:hidden;border:2px solid var(--kelp);background:radial-gradient(circle at 50% 40%,#3a3046,#17121c)}
.hchip svg{width:100%;height:100%;display:block;transform:scale(1.5)}
.hchip.foe{border-color:#a0483f;background:radial-gradient(circle at 50% 40%,#4a2a2a,#1a0c0c)}
.hchip.fresh{animation:fresh 1.6s ease-in-out infinite}
@keyframes fresh{50%{box-shadow:0 0 0 2px var(--blood),0 0 10px rgba(207,74,63,.75)}}
.peek{position:fixed;inset:0;z-index:50;background:rgba(10,8,12,.82);display:grid;place-items:center;cursor:pointer;
  padding-block:16px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.peekbox{display:flex;flex-direction:column;align-items:center;gap:10px}
.peek .hint{font-size:12px;color:var(--muted)}
/* ---------- phones ---------- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:clip}
body{overflow-x:clip}
body{overscroll-behavior-y:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,select,.card{touch-action:manipulation}
svg{-webkit-user-drag:none}
@media (hover:none){
  .hand .card.play:hover,.picks .card:hover,.pcard:hover,.ccard:hover,.mode:hover{transform:none}
  .drow:hover{border-color:var(--line)}
}
/* Phones: three slots a row, with the card a size down so the frame room still fits. */
@media (max-width:480px){.coll{font-size:8.2px}.coll .card{font-size:8.2px}}

  #app{gap:4px}.brand{font-size:18px}.top{gap:6px}

}
@media (max-height:700px) and (max-width:520px){
  .board{min-height:90px;padding:2px 0}.hist{min-height:26px}.hchip{width:26px;height:26px}.hand{padding-top:10px}.mid{min-height:22px}
}
.rotate{display:none}
/* ---------- landscape duel: slim status rail | board | preview + hand ---------- */
#app.duelland{max-width:none;height:100vh;height:100dvh;min-height:0;display:grid;grid-template-columns:72px minmax(340px,1fr) minmax(240px,1.15fr);
  gap:10px;overflow:hidden;padding:6px max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px))}
.lrail{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:0}
.lhero{display:flex;flex-direction:column;align-items:center;gap:5px}
.lhero.me{flex-direction:column-reverse}
.lhero .face{width:46px;height:46px}
.lhero .hpb{right:-9px;bottom:-5px;min-width:22px;height:22px;font-size:12px}
.lhero .arb{left:-9px;bottom:-5px;min-width:20px;height:20px;font-size:11px}
.lrow{display:flex;align-items:center;gap:5px}
.lmana{position:relative;width:30px;height:34px;display:grid;place-items:center;clip-path:polygon(50% 0,100% 28%,100% 72%,50% 100%,0 72%,0 28%);
  background:linear-gradient(160deg,#7cb8ee,#2f6fa8);color:#fff;font:800 13px var(--body);line-height:1;font-variant-numeric:tabular-nums}
.lmana small{position:absolute;bottom:4px;font-size:8px;font-weight:700;opacity:.85}
.lmana.none{background:linear-gradient(160deg,#3d3150,#2a2234);color:#8c7fa0}
.lsm{display:flex;gap:2px;justify-content:center;height:6px}
.lsm i{width:6px;height:6px;transform:rotate(45deg);background:#a77be8;border:1px solid #d2b8ff}
.power.mini{width:32px;height:32px;font-size:0;border-width:2px}
.power.mini::before{content:"✦";font-size:15px;color:var(--gold)}
.power.mini .pc{top:-7px;width:16px;height:16px;font-size:10px}
.power.mini .pn{display:none}
.lhist{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;overflow:hidden}
.lhist .hchip.off{display:none}
.lhist .hchip{width:28px;height:28px;flex:none}
.endb{flex:none;width:42px;height:42px;border-radius:50%;border:2px solid #f3c97a;color:#fff;display:grid;place-items:center;padding:0;
  background:radial-gradient(circle at 40% 35%,#f0a060,#a8401a 70%);box-shadow:0 3px 0 #0008}
.endb svg{width:20px;height:20px}

.hinfo .hname{display:none}
.endb{position:relative;border-color:transparent}.endb::before{content:"";position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;background:url(img/frame_endturn.png) center/100% 100% no-repeat;pointer-events:none}
.endb[disabled]{filter:grayscale(.85) brightness(.55);cursor:default}
.endb.glow{animation:glowE 1.4s ease-in-out infinite}
@keyframes glowE{50%{box-shadow:0 0 0 4px rgba(243,201,122,.35),0 0 18px rgba(243,160,96,.8)}}
.lboard{display:flex;flex-direction:column;justify-content:space-evenly;min-width:0;min-height:0}
.lboard .board{min-height:88px;padding:0}
.lboard .mid{min-height:20px;font-size:12.5px}
.lside{display:flex;flex-direction:column;min-width:0;min-height:0;gap:4px}

.lprev .card{font-size:clamp(7px,2.4vh,15px)}
.lprev .pbtns{display:flex;gap:8px;align-items:center}
.lprev .btn{padding:6px 14px;font-size:13px}
.lprev .who{display:grid;gap:2px;line-height:1.3}
.lprev .who b{color:var(--parch);font-family:var(--display);font-weight:400}
.lside .hand{flex:none;margin:0;padding:30px 4px 2px 22px;overflow:visible;justify-content:center;gap:7px}
.lside .hand .card{font-size:clamp(6px,2.25vh,12.5px)}
.lside .hand .card+.card{margin-left:var(--ov,0px)}
.lside .hand .card:hover,.lside .hand .card.pend{z-index:5}
.lside .hand .card.hsel{transform:translateY(-10px);z-index:6;box-shadow:0 0 0 .22em var(--gold),0 0 .9em rgba(243,201,122,.6)}
.lflag{position:absolute;top:6px;right:10px;z-index:3}
.mull{position:fixed;inset:0;z-index:60;background:rgba(10,7,14,.84);display:grid;place-items:center;padding:12px;overflow:auto}
.mbox{display:grid;justify-items:center;gap:10px;text-align:center;max-width:720px}
.mbox h2{margin:0}.mbox p{margin:0;color:var(--muted);font-size:13px;max-width:440px}
.mcards{display:flex;gap:2.9em;justify-content:center;flex-wrap:wrap;padding-top:8px}
.mc{position:relative;cursor:pointer}.mc .card{font-size:clamp(7px,2.5vh,10.8px);transition:filter .15s,transform .15s}
.mcards.many{gap:2.9em}.mcards.many .mc .card{font-size:min(clamp(7px,2.5vh,10.8px),2.5vw)}
.mc.x .card{filter:grayscale(.85) brightness(.45);transform:translateY(6px)}
.mc.pick .card{outline:3px solid var(--ready);transform:translateY(-6px)}
.mx{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;font-weight:800;color:var(--blood);pointer-events:none;text-shadow:0 2px 6px #000}
/* landscape board: minions are just their picture plus Attack/Health (name and keywords live in the long-press view) */
#app.duelland .min{padding:0}

#app.duelland .min .mart{position:absolute;inset:2px;width:auto;height:auto;border-radius:11px 11px 8px 8px}

#app.duelland .min .mart svg{position:absolute;left:-14%;width:128%;height:auto;top:50%;transform:translateY(-58%)}

@media (orientation:landscape) and (min-width:560px) and (min-height:520px){
  #app.duelland{zoom:1.35;height:calc(100dvh / 1.35)}
  #app.duelland .lside .hand .card{font-size:8.8px}#app.duelland .lprev .card{font-size:9.6px}
}
@media (orientation:landscape) and (min-width:560px) and (min-height:700px){
  #app.duelland{zoom:1.75;height:calc(100dvh / 1.75)}
}

/* standalone page: safe areas top and bottom (the artifact viewer supplied these before) */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:15px}
[hidden]{display:none!important}

// Portrait builder: race shape + clothing + headgear + held items. viewBox 100x64.
function portrait(o){
  const r=o.race,sk=o.skin||SKIN[r],hair=o.hair||'#5a3a22',robe=o.robe||'#5a4a6a',P=[].concat(o.prop||[]);
  const big=['giant','ogre','troll'].includes(r),small=['halfling','gnome','goblin'].includes(r);
  let s='';
  if(o.glow)s+=`<circle cx="50" cy="30" r="30" fill="${o.glow}" opacity=".22"/>`;
  if(P.includes('staff'))s+=`<rect x="74" y="12" width="2.6" height="52" fill="#6b4a2a"/><circle cx="75.3" cy="10" r="7.5" fill="${o.orb||'#8fd0ff'}" opacity=".35"/><circle cx="75.3" cy="10" r="4" fill="${o.orb||'#8fd0ff'}"/>`;
  if(P.includes('spear'))s+=`<rect x="75" y="8" width="2.2" height="56" fill="#6b4a2a"/><path d="M76.1 0l4 9h-8z" fill="#cfd6dc"/>`;
  if(P.includes('banner'))s+=`<rect x="76" y="4" width="2.2" height="60" fill="#6b4a2a"/><path d="M78 6h16l-4 7 4 7H78z" fill="${o.flag||'#b03a2e'}"/>`;
  if(P.includes('bow'))s+=`<path d="M24 6Q8 32 24 60" stroke="#8a5a2e" stroke-width="3" fill="none"/><path d="M24 6V60" stroke="#efe2c2" stroke-width=".8"/>`;
  if(P.includes('sword'))s+=`<rect x="74.5" y="6" width="3.4" height="38" fill="#d6dde2"/><path d="M74.5 6l1.7-5 1.7 5z" fill="#d6dde2"/><rect x="69" y="43" width="14.5" height="3" rx="1" fill="#b08a4a"/><rect x="75.2" y="46" width="2" height="10" fill="#5a3a22"/>`;
  if(P.includes('axe'))s+=`<rect x="75" y="8" width="2.6" height="56" fill="#6b4a2a"/><path d="M77.6 10q13 3 11 18q-6-7-11-5z" fill="#c9cfd4"/>`;
  if(P.includes('hammer'))s+=`<rect x="75" y="14" width="2.6" height="50" fill="#6b4a2a"/><rect x="69" y="7" width="15" height="9" rx="1.5" fill="#9aa3ad"/>`;
  if(P.includes('club'))s+=`<path d="M73 64l3-40q1-10 8-10t6 12l-9 38z" fill="#7a5a36"/>`;
  const sw=big?34:small?22:28,top=big?40:small?45:42;

  if(o.trim)s+=`<path d="M43 ${top+1}L50 58L57 ${top+1}" stroke="${o.trim}" stroke-width="2" fill="none"/>`;
  const cy=small?31:big?24:27,rx=big?13:small?9:10.5,ry=big?14:small?10.5:12.5;
  if(o.head==='hood')s+=`<path d="M${44-rx} ${top+5}Q${42-rx} ${cy-ry-6} 50 ${cy-ry-5}Q${58+rx} ${cy-ry-6} ${56+rx} ${top+5}Z" fill="${o.hood||robe}"/>`;

  pearl:{cls:'priest',c:1,t:'m',a:1,h:1,r:'c',race:'human',ward:1,n:['Temple Acolyte','神殿侍僧','神殿の侍祭'],f:['Her prayers land before the blows do.','她的祷告总比拳头先到。','祈りは拳より先に届く。']},
  apprentice:{cls:'mage',c:1,t:'m',a:1,h:2,r:'c',race:'human',bc:{dmg:1,tgt:'any'},n:["Wizard's Apprentice",'见习法师','魔術師の弟子'],f:['Only singed the eyebrows. This time.','这次只烧掉了眉毛。','今回は眉毛が焦げただけ。']},
  crab:{cls:'warrior',c:2,t:'m',a:1,h:4,r:'c',race:'dwarf',guard:1,n:['Dwarf Shieldbearer','矮人盾卫','ドワーフの盾持ち'],f:['The shield is older than he is.','这面盾比他还老。','その盾は彼より年上だ。']},
  harpooneer:{c:2,t:'m',a:2,h:2,r:'c',race:'elf',bc:{dmg:1,tgt:'any'},n:['Elven Archer','精灵弓手','エルフの射手'],f:['She has never needed a second arrow.','她从来不需要第二支箭。','二本目の矢は必要なかった。']},
  direwolf:{cls:'hunter',c:2,t:'m',a:3,h:2,r:'c',race:'beast',n:['Dire Wolf','恐狼','ダイアウルフ'],f:['The pack is never far behind.','狼群从不远离。','群れはすぐ後ろにいる。']},
  cleric:{cls:'priest',c:3,t:'m',a:3,h:4,r:'c',race:'dwarf',bc:{heal:3},n:['Dwarven Cleric','矮人牧师','ドワーフの僧侶'],f:['Prayer, ale, and a very large hammer.','祷告、麦酒，还有一把很大的锤子。','祈りとエールと、とても大きなハンマー。']},
  berserker:{cls:'warrior',c:2,t:'m',a:2,h:1,r:'c',race:'orc',surge:1,n:['Orc Berserker','兽人狂战士','オークの狂戦士'],f:['Thinks with his axe. Thinks fast.','用斧头思考，而且想得很快。','斧で考える。考えるのは速い。']},
  burglar:{c:2,t:'m',a:2,h:2,r:'r',race:'halfling',bc:{draw:1},n:['Halfling Burglar','半身人飞贼','ハーフリングの泥棒'],f:['Finders keepers.','谁捡到就是谁的。','見つけた者の物。']},
  eel:{c:3,t:'m',a:3,h:2,r:'r',race:'orc',surge:1,n:['Orc Raider','兽人劫掠者','オークの略奪者'],f:['First through the gate. Always.','永远第一个冲进城门。','門をくぐるのはいつも一番乗り。']},
  lurker:{c:4,t:'m',a:4,h:5,r:'c',race:'troll',n:['Forest Troll','密林巨魔','森のトロール'],f:['Leave a toll, or become one.','留下买路钱，或者把你自己留下。','通行料を置いていけ。さもなくばお前が通行料だ。']},
  sailor:{cls:'warlock',c:2,t:'m',a:1,h:2,r:'r',race:'undead',gasp:'bubble',n:['Grave Thrall','守墓亡仆','墓所の下僕'],f:['Death was only a change of employer.','死亡只是换了个雇主。','死は雇い主が変わっただけ。']},
  beastcaller:{cls:'hunter',c:3,t:'m',a:2,h:3,r:'r',race:'elf',bc:{summon:'elver'},n:['Elven Beastcaller','精灵兽语者','エルフの獣使い'],f:['She whistles once. Something always answers.','她吹一声口哨，总会有东西回应。','口笛ひとつで、必ず何かが応える。']},
  ghoul:{cls:'warlock',c:3,t:'m',a:3,h:3,r:'c',race:'undead',gasp:'bubble',n:['Barrow Ghoul','古冢食尸鬼','塚の食屍鬼'],f:['Hungry even after the end.','死后依旧饥饿。','終わりの後も飢えている。']},
  alchemist:{c:3,t:'m',a:2,h:2,r:'r',race:'gnome',bc:{buff:[2,0],tgt:'ally'},n:['Gnome Alchemist','侏儒炼金师','ノームの錬金術師'],f:["Drink this. Don't ask what's in it.",'喝了它。别问里面是什么。','これを飲め。中身は聞くな。']},
  knight:{cls:'paladin',c:4,t:'m',a:3,h:5,r:'r',race:'human',guard:1,n:['Paladin Vanguard','圣骑士先锋','聖騎士の先鋒'],f:['Behind her, no one falls.','在她身后，无人倒下。','彼女の後ろで倒れる者はいない。']},
  diver:{c:4,t:'m',a:3,h:4,r:'r',race:'gnome',bc:{draw:1},n:['Gnome Tinkerer','侏儒巧匠','ノームの技師'],f:['It works. Mostly. Twice so far.','它能用。大部分时候。目前成功过两次。','動く。たいてい。今のところ二回は。']},
  gull:{cls:'hunter',c:5,t:'m',a:4,h:4,r:'e',race:'beast',surge:1,n:['Griffon Rider','狮鹫骑士','グリフォンライダー'],f:['Arrives before the war horns finish.','战号还没吹完，他就到了。','角笛が鳴り終わる前に到着する。']},
  commander:{cls:'paladin',c:5,t:'m',a:4,h:4,r:'e',race:'human',bc:{team:[1,0]},n:['Knight Commander','骑士统领','騎士団長'],f:['Hold the line, then break theirs.','守住阵线，再冲破他们的。','戦線を守れ。それから奴らのを崩せ。']},
  golem:{c:5,t:'m',a:2,h:8,r:'c',race:'construct',guard:1,n:['Stone Golem','守门石像','ストーンゴーレム'],f:['It was told to guard the door. The door is long gone.','它被命令守门，可那扇门早就没了。','扉を守れと命じられた。扉はとうに無い。']},
  shark:{c:6,t:'m',a:6,h:6,r:'e',race:'giant',ward:1,n:['Runebound Giant','符文巨人','ルーンの巨人'],f:['Every rune is a spell someone wasted on it.','每道符文，都是有人白费在它身上的法术。','ルーンの一つ一つが、誰かが無駄にした呪文だ。']},
  firelem:{cls:'mage',c:6,t:'m',a:5,h:5,r:'r',race:'elemental',bc:{dmg:3,tgt:'any'},n:['Fire Elemental','火元素','炎の精霊'],f:['Do not offer it a hand to shake.','千万别向它伸手握手。','握手を求めてはいけない。']},
  axethrower:{c:6,t:'m',a:5,h:5,r:'c',race:'orc',bc:{dmg:2,tgt:'any'},n:['Orc Axe-Thrower','兽人掷斧手','オークの斧投げ'],f:['He always gets his axe back. Eventually.','他总能把斧头捡回来。迟早的事。','斧はいつか必ず取り戻す。']},
  ogre:{c:6,t:'m',a:6,h:7,r:'c',race:'giant',n:['Ogre Brute','食人魔莽夫','オーガの蛮兵'],f:['Two heads would be smarter. He has one.','两个脑袋会聪明些，可他只有一个。','頭が二つなら賢かったろう。彼には一つしかない。']},
  archmage:{cls:'mage',c:6,t:'m',a:6,h:7,r:'e',race:'human',bc:{draw:2},n:['Archmage of the Spire','尖塔大法师','尖塔の大魔導師'],f:['She has read every book in the tower. Twice.','塔里的每本书她都读过两遍。','塔の本は全て読んだ。二度ずつ。']},
  hexer:{c:4,t:'m',a:3,h:4,r:'c',race:'orc',bc:{dmg:2,tgt:'any'},n:['Orc Hexer','兽人咒术师','オークの呪術師'],f:['Every curse is a promise kept.','每一道诅咒，都是兑现的承诺。','呪いはすべて、守られた約束だ。']},
  priestess:{cls:'paladin',c:4,t:'m',a:3,h:4,r:'r',race:'human',bc:{buff:[2,2],tgt:'ally'},n:['Temple Priestess','神殿祭司','神殿の司祭'],f:['She blesses the brave and the foolish alike.','无论勇敢还是愚蠢，她一视同仁地祝福。','勇者にも愚者にも、等しく祝福を。']},
  necro:{cls:'warlock',c:4,t:'m',a:3,h:4,r:'r',race:'human',bc:{summon:'bubble'},n:['Necromancer','死灵法师','ネクロマンサー'],f:['Nobody stays dead on his watch.','在他看守下，没人能安息。','彼の見張りの下では、誰も死んだままでいられない。']},
  thane:{cls:'warrior',c:5,t:'m',a:5,h:5,r:'r',race:'dwarf',bc:{armor:4},n:['Dwarf Thane','矮人领主','ドワーフの領主'],f:['His hall has never fallen. Neither has he.','他的大厅从未陷落，他本人也是。','彼の広間は一度も落ちていない。彼自身もだ。']},
  wyvern:{c:6,t:'m',a:5,h:5,r:'e',race:'dragon',surge:1,n:['Wyvern Rider','飞龙骑手','ワイバーンライダー'],f:['The sky is just another road.','天空只是另一条路。','空もまた、ただの道だ。']},
  treant:{c:7,t:'m',a:6,h:9,r:'r',race:'treant',guard:1,n:['Ancient Treant','远古树人','古の樹人'],f:['It was old when the first king was crowned.','第一位国王加冕时，它就已经很老了。','最初の王が戴冠した時、すでに老いていた。']},
  dragonknight:{c:7,t:'m',a:5,h:5,r:'e',race:'human',gasp:'spawn',n:['Dragon Knight','龙骑士','竜騎士'],f:['When he falls, his dragon does not.','他倒下时，他的龙不会。','彼が倒れても、竜は倒れない。']},
  leviathan:{c:8,t:'m',a:10,h:10,r:'l',race:'dragon',spellward:1,bc:{cull:4},n:['Ignaroth, Ashen Wyrm','灰烬巨龙伊格纳洛斯','灰燼竜イグナロス'],x:['Spellproof (spells cannot damage or destroy it, except Warrior and Hunter spells). On play: destroy every minion with less than 4 Health.','法术免疫（不受法术伤害和消灭，战士与猎人的法术除外）。登场：消灭场上所有生命值低于4的随从。','呪文無効（呪文のダメージと破壊を受けない。戦士と狩人の呪文は除く）。登場時：体力4未満のミニオンをすべて破壊する。'],f:['The crown was forged in his breath.','那顶王冠，正是在他的龙息中锻成。','王冠は彼の吐息で鍛えられた。']},
  lich:{cls:'warlock',c:8,t:'m',a:6,h:6,r:'l',race:'undead',sp:2,bc:{team:[3,-1],teamRace:'undead'},n:['Malakar the Undying','不朽者马拉卡','不死のマラカル'],x:['Spell Damage +2. On play: your Undead minions get +3 Attack and -1 Health (never below 1).','法术伤害+2。登场：你的所有亡灵随从获得+3攻击力和-1生命值（最低为1）。','呪文ダメージ+2。登場時：自分のアンデッドのミニオンすべてに攻撃力+3、体力-1（1未満にはならない）。'],f:['He has died eleven times. He is getting better at it.','他已经死过十一次了，而且越来越熟练。','十一度死んだ。だんだん上手くなっている。']},
  dwarfking:{c:8,t:'m',a:7,h:10,r:'l',race:'dwarf',guard:1,bc:{team:[3,3],teamWard:1},n:['Thorgrim, King Under Stone','山心之王索格林','石下の王ソーグリム'],x:['Guard. On play: your minions get +3/+3 and Ward.','守护。登场：你的所有随从获得+3/+3和护盾。','ガード。登場時：自分のミニオンすべてに+3/+3と結界を与える。'],f:['His beard has its own throne.','他的胡子都有自己的王座。','彼の髭には専用の玉座がある。']},
  elfqueen:{c:8,t:'m',a:5,h:7,r:'l',race:'elf',ward:1,swings:3,norip:1,bc:{heal:8},n:['Sylvara, Queen of the Glade','翠林女王希尔瓦拉','森の女王シルヴァラ'],x:['Ward. Attacks three times a turn and takes no damage striking back. On play: restore 8 Health to your hero.','护盾。每回合可攻击三次，攻击时不受反击伤害。登场：为你的英雄恢复8点生命值。','結界。1ターンに3回攻撃でき、反撃ダメージを受けない。登場時：自分のヒーローの体力を8回復する。'],f:['The forest kneels when she walks.','她走过时，森林为之屈膝。','彼女が歩けば、森がひざまずく。']},
  spray:{cls:'hunter',c:1,t:'s',r:'c',fx:{dmg:2,tgt:'any'},n:['Arcane Shot','奥术射击','アーケインショット'],f:['Quicker than a thought, and twice as sharp.','比念头更快，也更锋利。','思考より速く、二倍鋭い。']},
  brace:{cls:'paladin',c:1,t:'s',r:'c',fx:{buff:[0,3],guard:1,tgt:'ally'},n:['Shield of Faith','信仰之盾','信仰の盾'],f:['Belief, hammered into steel.','把信念锻打成钢。','信念を鋼に打ち込む。']},
  darkpact:{cls:'warlock',c:1,t:'s',r:'r',fx:{selfDmg:2,draw:2},n:['Dark Pact','黑暗契约','闇の契約'],f:['Sign here. And here. And in blood, here.','在这里签字。这里也是。还有这里，用血签。','ここに署名を。ここにも。そしてここは血で。']},
  frenzy:{cls:'warrior',c:2,t:'s',r:'r',fx:{buff:[3,0],tgt:'ally'},n:['Bloodlust','嗜血','血の渇き'],f:['One taste is enough.','尝一口就够了。','一口で十分だ。']},
  tidepool:{cls:'mage',c:3,t:'s',r:'c',fx:{draw:2},n:["Scholar's Insight",'典籍启示','賢者の洞察'],f:['Footnotes are where the real magic hides.','真正的魔法都藏在脚注里。','本当の魔法は脚注に隠れている。']},
  mend:{cls:'priest',c:2,t:'s',r:'r',fx:{heal:4},n:['Healing Light','治愈之光','癒しの光'],f:['Warm as a hearth, quick as a prayer.','像炉火一样温暖，像祷告一样迅速。','暖炉のように温かく、祈りのように速い。']},
  shieldwall:{cls:'warrior',c:2,t:'s',r:'c',fx:{armor:4},n:['Shield Wall','盾墙','盾の壁'],f:['Lock shields. Lock eyes. Hold.','盾牌相扣，目光相接，守住。','盾を組め。目を据えろ。踏みとどまれ。']},
  calltoarms:{cls:'paladin',c:3,t:'s',r:'c',fx:{summon:['minnow','minnow','minnow']},n:['Call to Arms','征召号角','召集令'],f:['Farmers today. Heroes, maybe, tomorrow.','今天是农夫，明天也许就是英雄。','今日は農夫。明日は、たぶん英雄。']},
  undertow:{cls:'paladin',also:'priest',c:3,t:'s',r:'r',fx:{dmg:4,tgt:'minion'},n:['Smite','天罚','天罰'],f:['Judgment, delivered from above.','来自天上的审判。','天上より下される裁き。']},
  radiant:{cls:'paladin',also:'priest',c:3,t:'s',r:'r',fx:{aoe:1,heal:4},n:['Radiant Burst','圣光迸发','光輝の爆発'],f:['Light that burns the wicked and warms the faithful.','灼烧邪恶、温暖信徒的光。','悪を焼き、信じる者を温める光。']},
  hymn:{c:3,t:'s',r:'r',fx:{team:[1,1]},n:['Battle Hymn','激昂战歌','戦いの賛歌'],f:['Off-key, but very loud.','跑调了，但非常响亮。','音程は外れているが、とても大きい。']},
  lance:{cls:'mage',c:3,t:'s',r:'r',fx:{dmg:4,tgt:'minion',draw:1},n:['Arcane Lance','奥术之矛','秘術の槍'],f:['Pierce, then ponder.','先刺穿，再思考。','貫いてから、考えよ。']},
  maelstrom:{cls:'mage',c:3,t:'s',r:'e',fx:{aoe:2},n:['Fireball','火球术','ファイアボール'],f:['Aim for the middle.','瞄准中间就行。','真ん中を狙え。']},
  riptide:{cls:'hunter',c:5,t:'s',r:'e',fx:{dmg:6,tgt:'any'},n:['Deadly Shot','致命射击','必殺の射撃'],f:['One breath. One arrow. One less problem.','一次呼吸，一支箭，少一个麻烦。','一呼吸、一矢、厄介事が一つ減る。']},
  breath:{c:6,t:'s',r:'e',fx:{aoe:3,face:3},n:["Dragon's Breath",'龙息','竜の息吹'],f:['The last thing the castle walls ever felt.','城墙感受到的最后一样东西。','城壁が最後に感じたもの。']},
  inferno:{cls:'warlock',c:5,t:'s',r:'e',fx:{aoe:4},n:['Inferno','焦土烈焰','業火'],f:['Nothing grows here anymore. Nothing will.','这里已寸草不生，以后也不会再有。','もう何も育たない。これからも。']},
  // ---- class spells (cls: only that class may use them; x: rules text in every language) ----
  innerrage:{c:0,t:'s',r:'c',cls:'warrior',fx:{dmg:1,buff:[2,0],tgt:'minion'},n:['Inner Rage','怒火中烧','内なる怒り'],x:['Deal 1 damage to a minion and give it +2 Attack.','对一个随从造成1点伤害，并使其获得+2攻击力。','ミニオン1体に1ダメージを与え、攻撃力+2を付与する。'],f:['Pain is a fine whetstone.','痛苦是最好的磨刀石。','痛みは良い砥石だ。']},
  whirlwind:{c:1,t:'s',r:'c',cls:'warrior',fx:{sweep:1},n:['Whirlwind','旋风斩','旋風斬り'],x:['Deal 1 damage to ALL minions.','对所有随从造成1点伤害。','全てのミニオンに1ダメージを与える。'],f:['Friends should stand further back.','朋友们最好站远一点。','味方はもっと離れて立つべきだ。']},
  shieldslam:{c:1,t:'s',r:'e',cls:'warrior',fx:{armorDmg:1,tgt:'minion'},n:['Shield Slam','盾牌猛击','シールドスラム'],x:['Deal damage to a minion equal to your Armor.','对一个随从造成等同于你护甲值的伤害。','ミニオン1体に、自分の装甲と同じだけのダメージを与える。'],f:['The best defense is a very heavy offense.','最好的防守，是非常沉重的进攻。','最大の防御は、とても重い攻撃だ。']},
  execute:{c:2,t:'s',r:'r',cls:'warrior',fx:{destroy:1,cond:'damaged',tgt:'foe'},n:['Execute','斩杀','処刑'],x:['Destroy a damaged enemy minion.','消灭一个受伤的敌方随从。','ダメージを受けている敵のミニオン1体を破壊する。'],f:['Finish what you started.','把开始的事做完。','始めたことは終わらせろ。']},
  missiles:{c:1,t:'s',r:'c',cls:'mage',fx:{dmg:1,tgt:'any',multi:3},n:['Arcane Missiles','奥术飞弹','アーケインミサイル'],x:['Deal 1 damage to each of three targets of your choice (a target may be chosen more than once).','对你选择的三个目标各造成1点伤害（可以重复选择同一目标）。','選んだ3つの対象にそれぞれ1ダメージを与える（同じ対象を複数回選んでもよい）。'],f:['Not aimed. Not needed.','无需瞄准，也不需要瞄准。','狙いは要らない。'] },
  mirror:{c:1,t:'s',r:'c',cls:'mage',fx:{summon:['mirrorimg','mirrorimg']},n:['Mirror Image','镜影分身','ミラーイメージ'],x:['Summon two 1/3 Mirror Images with Guard.','召唤两个1/3并具有守护的镜影。','ガードを持つ1/3のミラーイメージを2体召喚する。'],f:['Which one is real? Neither.','哪个是真的？都不是。','どれが本物？どれでもない。']},
  frostbolt:{c:2,t:'s',r:'c',cls:'mage',fx:{dmg:4,freeze:1,tgt:'any'},n:['Frostbolt','寒冰箭','フロストボルト'],x:['Deal 4 damage and Freeze the target.','造成4点伤害，并冻结目标。','4ダメージを与え、対象を凍結させる。'],f:['Chill out.','冷静一下。','頭を冷やせ。']},
  frostnova:{c:2,t:'s',r:'r',cls:'mage',fx:{aoe:1,freezeAll:1},n:['Frost Nova','冰霜新星','フロストノヴァ'],x:['Deal 1 damage to all enemy minions and Freeze them.','对所有敌方随从造成1点伤害，并将其冻结。','敵のミニオン全てに1ダメージを与え、凍結させる。'],f:['Everyone hold still.','所有人都别动。','全員、動くな。']},
  squires:{c:2,t:'s',r:'c',cls:'paladin',fx:{summon:['minnow','minnow']},n:["Squire's Call",'侍从集结','従者の召集'],f:['Bring your own bucket.','自带水桶。','バケツは各自持参。']},
  humility:{c:2,t:'s',r:'r',cls:'paladin',fx:{setAtk:1,tgt:'foe'},n:['Humility','谦卑','謙虚'],x:["Change an enemy minion's Attack to 1.",'使一个敌方随从的攻击力变为1。','敵のミニオン1体の攻撃力を1にする。'],f:['Kneel, and be smaller.','跪下，然后变得渺小。','ひざまずき、小さくなれ。']},
  aegis:{c:1,t:'s',r:'c',cls:'paladin',fx:{ward:1,draw:1,tgt:'ally'},n:['Sacred Aegis','圣盾术','聖なる盾'],x:['Give a friendly minion Ward. Draw a card.','使一个友方随从获得护盾。抽一张牌。','味方のミニオン1体に結界を付与する。カードを1枚引く。'],f:['The light catches the first blow.','圣光会接下第一击。','光が最初の一撃を受け止める。']},
  kings:{c:4,t:'s',r:'r',cls:'paladin',fx:{buff:[4,4],tgt:'ally'},n:['Blessing of Kings','王者祝福','王の祝福'],f:['Crowned for one glorious battle.','为一场荣耀之战而加冕。','栄光の一戦のための戴冠。']},
  pounce:{c:0,t:'s',r:'c',cls:'hunter',fx:{tempAtk:2,tgt:'ally'},n:['Pounce','猛扑','飛びかかり'],x:['Give a friendly minion +2 Attack this turn.','本回合中，使一个友方随从获得+2攻击力。','このターンの間、味方のミニオン1体に攻撃力+2を付与する。'],f:['Now.','就是现在。','今だ。']},
  huntmark:{c:1,t:'s',r:'r',cls:'hunter',fx:{setHp:1,tgt:'foe'},n:["Hunter's Mark",'猎手印记','狩人の印'],x:["Change an enemy minion's Health to 1.",'使一个敌方随从的生命值变为1。','敵のミニオン1体の体力を1にする。'],f:['Marked, then missed by no one.','被标记之后，再没人会失手。','印をつけたら、もう誰も外さない。']},
  killcmd:{c:2,t:'s',r:'c',cls:'hunter',fx:{dmg:3,dmgBeast:5,tgt:'any'},n:['Kill Command','猎杀令','キルコマンド'],x:['Deal 3 damage. If you control a Beast, deal 5 instead.','造成3点伤害。如果你控制一只野兽，改为造成5点伤害。','3ダメージを与える。味方に獣がいる場合、代わりに5ダメージを与える。'],f:['One word. Many teeth.','一个字，许多牙。','一言で、牙が並ぶ。']},
  hounds:{c:3,t:'s',r:'e',cls:'hunter',fx:{perFoe:'hound'},n:['Unleash the Hounds','群犬出猎','猟犬を放て'],x:['For each enemy minion, summon a 1/1 Hound with Charge.','每有一个敌方随从，便召唤一只1/1并具有冲锋的猎犬。','敵のミニオン1体につき、突撃を持つ1/1の猟犬を1体召喚する。'],f:['Let them hunt.','让它们去猎吧。','狩らせろ。']},
  pwshield:{c:2,t:'s',r:'c',cls:'priest',fx:{buff:[0,2],draw:1,tgt:'ally'},n:['Word of Shielding','庇护之言','守りの言葉'],f:['Spoken softly. Struck hard.','轻声念出，重重挡下。','静かに唱え、強く守る。']},
  holysmite:{c:1,t:'s',r:'c',cls:'priest',fx:{dmg:2,tgt:'minion'},n:['Holy Smite','神圣惩击','ホーリースマイト'],f:['A small sun, very briefly.','一个小太阳，转瞬即逝。','ほんの一瞬の、小さな太陽。']},
  dispel:{c:1,t:'s',r:'r',cls:'priest',fx:{silence:1,tgt:'minion'},n:['Dispel','驱散','ディスペル'],x:['Silence a minion: it loses its buffs, keywords and effects.','沉默一个随从：它失去所有增益、关键词和效果。','ミニオン1体を沈黙させる（強化、キーワード、効果を全て失う）。'],f:['Hush.','嘘。','静かに。']},
  swpain:{c:3,t:'s',r:'r',cls:'priest',fx:{destroy:1,cond:'atk<=3',tgt:'foe'},n:['Word of Pain','苦痛之言','苦痛の言葉'],x:['Destroy an enemy minion with 3 or less Attack.','消灭一个攻击力小于或等于3的敌方随从。','攻撃力3以下の敵のミニオン1体を破壊する。'],f:['The small ones go quietly.','小家伙们走得很安静。','小さき者は静かに逝く。']},
  swdeath:{c:4,t:'s',r:'e',cls:'priest',fx:{destroy:1,cond:'atk>=5',tgt:'foe'},n:['Word of Death','死亡之言','死の言葉'],x:['Destroy an enemy minion with 5 or more Attack.','消灭一个攻击力大于或等于5的敌方随从。','攻撃力5以上の敵のミニオン1体を破壊する。'],f:['The bigger they are.','块头越大……','大きい者ほど。']},
  soulfire:{c:1,t:'s',r:'r',cls:'warlock',fx:{dmg:4,selfDmg:2,tgt:'any'},n:['Soulfire','灵魂之火','ソウルファイア'],x:['Deal 4 damage. Your hero takes 2 damage.','造成4点伤害。你的英雄受到2点伤害。','4ダメージを与える。自分のヒーローは2ダメージを受ける。'],f:['Burns twice: once out, once in.','烧两次：一次向外，一次向内。','二度焼く。外へ一度、内へ一度。']},
  coil:{c:1,t:'s',r:'c',cls:'warlock',fx:{dmg:2,drawIfKill:1,tgt:'minion'},n:['Mortal Coil','死亡缠绕','デスコイル'],x:['Deal 2 damage to a minion. If that kills it, draw a card.','对一个随从造成2点伤害。如果它因此死亡，抽一张牌。','ミニオン1体に2ダメージを与える。それで倒した場合、カードを1枚引く。'],f:['Every ending is a lesson.','每次终结都是一堂课。','終わりはすべて教訓だ。']},
  raisedead:{c:1,t:'s',r:'c',cls:'warlock',fx:{summon:['skeleton','skeleton'],selfDmg:1},n:['Raise Dead','亡者复生','死者の蘇生'],x:['Summon two 1/1 Skeletons. Your hero takes 1 damage.','召唤两个1/1的骷髅兵。你的英雄受到1点伤害。','1/1のスケルトンを2体召喚する。自分のヒーローは1ダメージを受ける。'],f:['Up. Up! Good bones.','起来，起来！好骨头。','起きろ、起きろ！良い骨だ。']},
  hellfire:{c:3,t:'s',r:'e',cls:'warlock',fx:{sweep:3,heroes:1},n:['Hellfire','地狱烈焰','ヘルファイア'],x:['Deal 3 damage to ALL characters.','对所有角色造成3点伤害。','全てのキャラクターに3ダメージを与える。'],f:['It does not ask whose side you are on.','它不问你站在哪一边。','どちらの味方かは問わない。']},
  // ---- neutral spell support ----
  retreat:{c:1,t:'s',r:'c',fx:{bounce:1,tgt:'ally'},n:['Tactical Retreat','暂避锋芒','戦術的撤退'],x:['Return a friendly minion to your hand.','将一个友方随从移回你的手牌。','味方のミニオン1体を手札に戻す。'],f:['Live to charge again.','活下来，才能再冲锋。','生きて、もう一度突撃しよう。']},
  wyrmling:{cls:'mage',c:1,t:'m',a:2,h:3,r:'r',race:'dragon',onSpell:[1,0],n:['Mana Wyrmling','法力幼龙','マナの幼竜'],x:['Whenever you cast a spell, gain +1 Attack.','每当你施放一个法术，获得+1攻击力。','自分が呪文を使うたび、攻撃力+1を得る。'],f:['It eats spells. It is always hungry.','它以法术为食，而且永远吃不饱。','呪文を食べる。いつも腹ぺこだ。']},
  geomancer:{c:2,t:'m',a:2,h:2,r:'c',race:'gnome',sp:1,n:['Gnome Geomancer','侏儒地脉师','ノームの地相術師'],x:['Spell Damage +1. Your spells deal 1 extra damage.','法术伤害+1。你的法术多造成1点伤害。','呪文ダメージ+1。自分の呪文のダメージが1増える。'],f:['The ground hums along with her.','大地随她一同低吟。','大地が彼女と共に唸る。']},
  spellbreaker:{cls:'priest',c:4,t:'m',a:4,h:3,r:'r',race:'elf',bc:{silence:1,tgt:'minion'},n:['Elven Spellbreaker','精灵破法者','エルフの呪文破り'],x:['On play: Silence a minion.','登场：沉默一个随从。','登場時：ミニオン1体を沈黙させる。'],f:['Magic is a habit. She breaks habits.','魔法是一种习惯，而她专破习惯。','魔法は癖だ。彼女は癖を断つ。']},
  bubble:{c:1,t:'m',a:2,h:1,r:'t',race:'undead',token:1,n:['Restless Spirit','怨灵','怨霊'],f:['It remembers being angry.','它记得自己曾经很愤怒。','怒っていたことだけは覚えている。']},
  // beta: Mage Embers / Priest Prayers (only on /beta/, removed elsewhere)
  emberbolt:{beta:1,c:1,t:'s',r:'c',cls:'mage',fx:{dmg:2,tgt:'any'},n:['Ember Flick','余烬火花','残り火の閃き'],f:['Small fire, patient hands.','小小的火，耐心的手。','小さな火と、辛抱強い手。']},
  icelance:{beta:1,c:1,t:'s',r:'c',cls:'mage',fx:{icelance:4,tgt:'foe'},n:['Ice Lance','冰枪术','アイスランス'],x:['Freeze an enemy minion. If it was already Frozen, deal 4 damage to it instead.','冻结一个敌方随从。如果它已被冻结，改为对它造成4点伤害。','敵のミニオン1体を凍結させる。すでに凍結しているなら、代わりに4ダメージを与える。'],f:['Cold first. Then sharp.','先冷，再锋利。','まず冷たく、次に鋭く。']},
  frostele:{beta:1,c:4,t:'m',a:3,h:6,r:'r',race:'elemental',cls:'mage',bc:{freeze:1,tgt:'foe'},n:['Frost Elemental','寒冰元素','氷の精霊'],x:['On play: Freeze an enemy minion.','登场：冻结一个敌方随从。','登場時：敵のミニオン1体を凍結させる。'],f:['It does not hate you. It is just very, very cold.','它不恨你，只是非常非常冷。','憎んではいない。ただ、とても冷たい。']},
  shatter:{beta:1,c:2,t:'s',r:'r',cls:'mage',fx:{destroy:1,cond:'frozen<5',tgt:'foe'},n:['Shatter','碎冰','砕氷'],x:['Destroy a Frozen enemy minion with less than 5 Health.','消灭一个生命值低于5的被冻结敌方随从。','体力5未満の凍結している敵のミニオン1体を破壊する。'],f:['Ice remembers every crack.','冰记得每一道裂痕。','氷はすべてのひびを覚えている。']},
  voidacolyte:{beta:1,c:2,t:'m',a:2,h:1,r:'c',race:'human',cls:'priest',bc:{silence:1,tgt:'minion'},n:['Void Acolyte','虚空侍僧','虚無の侍僧'],x:['On play: Silence a minion.','登场：沉默一个随从。','登場時：ミニオン1体を沈黙させる。'],f:['She listens to the quiet between prayers.','她聆听祷文之间的寂静。','祈りと祈りの間の静けさに耳を澄ます。']},
  wordruin:{beta:1,c:3,t:'s',r:'r',cls:'priest',fx:{destroy:1,cond:'damaged',tgt:'foe'},n:['Word of Ruin','毁灭之言','破滅の言葉'],x:['Destroy a damaged enemy minion.','消灭一个受伤的敌方随从。','ダメージを受けている敵のミニオン1体を破壊する。'],f:['Finish what the blade began.','把刀刃开始的事做完。','刃が始めたことを終わらせる。']},
  wordtorment:{beta:1,c:6,t:'s',r:'e',cls:'priest',fx:{destroy:1,tgt:'foe'},n:['Word of Torment','折磨之言','責苦の言葉'],x:['Destroy an enemy minion.','消灭一个敌方随从。','敵のミニオン1体を破壊する。'],f:['Spoken once. Heard forever.','只说一次，永远回响。','一度だけ唱え、永遠に響く。']},
  steady:{beta:1,c:2,t:'s',r:'c',cls:'hunter',fx:{dmg:3,tgt:'any'},n:['Steady Shot','稳固射击','着実な射撃'],f:['Breathe out. Then let go.','呼气，然后放手。','息を吐いて、放つ。']},
  explosive:{beta:1,c:4,t:'s',r:'r',cls:'hunter',fx:{dmg:4,splash:1,tgt:'foe'},n:['Explosive Shot','爆裂射击','爆裂射撃'],x:['Deal 4 damage to an enemy minion and 1 to the other enemy minions.','对一个敌方随从造成4点伤害，并对其他敌方随从各造成1点伤害。','敵のミニオン1体に4ダメージ、他の敵のミニオンに1ダメージ。'],f:['Aim for the one in the middle.','瞄准中间那个。','真ん中を狙え。']},
  marksman:{beta:1,c:3,t:'m',a:3,h:3,r:'r',race:'elf',cls:'hunter',pw:1,n:['Elven Marksman','精灵神射手','エルフの名射手'],x:['Your hero power deals 1 extra damage.','你的英雄技能伤害+1。','ヒーローパワーのダメージ+1。'],f:['Never misses twice.','从不连续失手。','二度は外さない。']},
  whistle:{beta:1,c:0,t:'s',r:'t',token:1,cls:'hunter',fx:{summon:'whound'},n:['Hound Whistle','唤犬哨','猟犬の笛'],f:['One short, one long.','一短，一长。','短く一回、長く一回。']},
  phound:{beta:1,c:1,t:'m',a:2,h:1,r:'t',race:'beast',token:1,n:['Pack Hound','群猎犬','群れの猟犬'],f:['Follows the loudest voice.','跟着最响的声音走。','一番大きな声についていく。']},
  bonewarr:{beta:1,c:3,t:'m',a:2,h:2,r:'t',race:'undead',token:1,n:['Bone Warrior','骷髅战士','骸骨戦士'],f:['Built from many. Loyal to one.','由许多人拼成，只效忠一人。','多くから組まれ、一人に仕える。']},
  icebarrier:{beta:1,c:3,t:'s',r:'r',cls:'mage',fx:{armor:5,freezeBig:1},n:['Ice Barrier','寒冰屏障','アイスバリア'],x:['Gain 5 Armor. Freeze the enemy minion with the highest Attack.','获得5点护甲。冻结攻击力最高的敌方随从。','装甲を5獲得する。攻撃力が最も高い敵のミニオンを凍結させる。'],f:['The wall is clear. So is the message.','冰墙透明，意思也很明白。','壁は透明だ。言いたいことも。']},
  emberadept:{beta:1,c:2,t:'m',a:2,h:3,r:'c',race:'human',cls:'mage',n:['Ember Adept','余烬学徒','残り火の徒弟'],f:['Burns her notes after memorizing them.','背下来就把笔记烧掉。','覚えたらノートは燃やす。']},

function fxText(fx,tgt){
  const F=I18N[L].fx,out=[];
  if(fx.selfDmg)out.push(F.self(fx.selfDmg));
  if(fx.dmg)out.push(F.dmg(fx.dmg,tgt==='minion'));
  if(fx.aoe)out.push(fx.face?F.aoeAll(fx.aoe):F.aoe(fx.aoe));
  else if(fx.face)out.push(F.face(fx.face));
  if(fx.healT)out.push(F.healT(fx.healT));
  if(fx.buff)out.push(F.buff(F.stat(fx.buff[0],fx.buff[1]),fx.guard,fx.ward));
  if(fx.team)out.push(F.team(F.stat(fx.team[0],fx.team[1])));
  if(fx.summon){const a=[].concat(fx.summon),c=CARDS[a[0]];out.push(F.summon(a.length,c.a,c.h,cn(a[0])))}
  if(fx.heal)out.push(F.heal(fx.heal));
  if(fx.armor)out.push(F.armor(fx.armor));
  if(fx.draw)out.push(F.draw(fx.draw));
  if(fx.mana)out.push(F.mana(fx.mana));
  if(fx.ember)out.push(F.ember(fx.ember));
  if(fx.purge)out.push(F.purge(fx.purge));
  if(fx.revive)out.push(F.revive);
  if(fx.reclaim)out.push(F.reclaim(fx.reclaim));
  if(fx.hasten)out.push(F.hasten(fx.hasten));
  if(BETA&&fx.freeze)out.push(['Freeze it.','并冻结目标。','対象を凍結させる。'][li()]);
  if(BETA&&fx.tempAtk)out.push([`+${fx.tempAtk} Attack this turn.`,`本回合+${fx.tempAtk}攻击力。`,`このターン攻撃力+${fx.tempAtk}。`][li()]);
  if(BETA&&fx.rush)out.push(['It can attack this turn.','它本回合可以攻击。','このターン攻撃できる。'][li()]);
  if(BETA&&fx.pierce)out.push(['Ignores Armor and Ward.','无视护甲与护盾。','装甲と結界を無視する。'][li()]);
  if(BETA&&fx.wardSummon)out.push(['With Ward.','带护盾。','結界付き。'][li()]);
  if(BETA&&fx.splash)out.push([`${fx.splash} damage to the other enemy minions.`,`对其他敌方随从各造成${fx.splash}点伤害。`,`他の敵のミニオンに${fx.splash}ダメージ。`][li()]);
  return out.join(F.sep);
}
function cardText(k){
  const c0=CARDS[k],ov=FOV&&FOV[k],c=ov?{...c0,...ov}:c0,F=I18N[L].fx;
  if(ov&&ov.x)return ov.x[li()];
  if(c.x&&!(ov&&(ov.fx||ov.pray)))return c.x[li()];
  const kws=['guard','ward','surge'].filter(x=>c[x]).map(x=>F.kw[x]);
  let s=kws.length?kws.join(F.kwSep)+F.end:'';
  if(c.bc)s+=(s?F.sep:'')+F.onPlay+fxText(c.bc,c.bc.tgt);
  if(c.gasp){const g=CARDS[c.gasp];s+=(s?F.sep:'')+F.last+F.summon(1,g.a,g.h,cn(c.gasp))}
  if(c.fx)s+=fxText(c.fx,c.fx.tgt);
  if(c.pray)s+=F.pray(c.pray.cd)+fxText(c.pray.fx);
  return s;
}

function rollRewards(stage){
  const w={c:3,r:2,e:1,l:stage>=2?1:0},pool=[];
  // Beta: cards of the schools you have talents in come up three times as often.
  const sch=new Set((R.tal||[]).map(id=>TAL_PAGE[id]&&TAL_PAGE[id].sc));
  // Cards the deck already holds the most copies of (a Legendary it has) are never offered.
  COLLECT.filter(k=>forCls(k,R.cls)&&fits(R.deck,k)).forEach(k=>{for(let i=0;i<w[CARDS[k].r]*(CARDS[k].sc&&sch.has(CARDS[k].sc)?3:1);i++)pool.push(k)});
  const out=[];
  while(out.length<3){const k=pool[Math.random()*pool.length|0];if(!out.includes(k))out.push(k)}
  return out;
}

// Replaced cards are swapped for new draws, then go to the bottom of the deck. No randomness, so both

function mulligan(side,idx){

  const back=pick.map(i=>s.hand[i]);s.hand=s.hand.filter((k,i)=>!pick.includes(i));s.hb=[];
  for(let n=0;n<back.length&&s.deck.length;n++){s.hand.push(s.deck.pop());if(side==='p')S.drew++}

      const sp=showPlay('e',k,null);await wait(900);
      const bc=cardBc('e',k),m=summon('e',k),hh=pushHist('e',k,null);S.lastE={m,h:hh,bc};render();
      if(bc&&!bc.tgt){await fxAnim(bc,sp.card,null,'e');applyFx('e',bc,null)}
      sp.close();
    }else{
      const t=netDeref(a.tgt);if(a.tgt&&!t)throw new Error('target missing');
      const extra=(a.ts||[]).map(r=>{const x=netDeref(r);if(!x)throw new Error('target missing');return x});
      if(t)say('eCastOn',en,()=>cn(k),()=>nm(t));else say('eCast',en,()=>cn(k));render();
      const sp=showPlay('e',k,t);await wait(1100);pushHist('e',k,t);render();
      if(t)await aimAt(t);
      if(extra.length)await missiles(sp.card,[t,...extra]);else await fxAnim(cardFx('e',k),sp.card,t,'e');castSpell('e',k,t,extra);sp.close();
    }
  }else if(a.t==='pick'){
    reclaimTake('e',a.ks||[]);render();
  }else if(a.t==='rite'){
    ritePick('e',(a.ks||[])[0]);render();
  }else if(a.t==='bc'){
    const last=S.lastE,t=netDeref(a.tgt);if(!last||(a.tgt&&!t))throw new Error('battlecry out of step');
    const fx=last.bc;if(!fx)throw new Error('battlecry out of step');if(t){last.h.t=t;render();await aimAt(t)}
    await fxAnim(fx,`[data-t="${idOf(last.m)}"]`,t,'e');applyFx('e',fx,t);
  }else if(a.t==='power'){
    const p=e.power,t=netDeref(a.tgt);if(a.tgt&&!t)throw new Error('target missing');
    e.mana-=pcost('e');e.powerUsed=true;
    if(t)await aimAt(t);
    await fxAnim(p.fx,'[data-epow]',t,'e');applyFx('e',p.fx,t,powerBonus('e'));afterPower('e');say('ePower',en,()=>pn(p),t?()=>nm(t):null);
  }else if(a.t==='atk'){
    const m=e.board.find(x=>x.uid===a.a),t=netDeref(a.tgt);if(!m||!t)throw new Error('attack out of step');
    say('attacks',()=>nm(m),()=>nm(t));render();
    await lunge(idOf(m),idOf(t));doAttack(m,t);
  }
  cleanup();render();await wait(350);
}

function quitDuel(){

  if(!Q.quitArm){Q.quitArm=true;render();setTimeout(()=>{if(Q.quitArm){Q.quitArm=false;if(view==='duel')render()}},3000);return}
  Q.quitArm=false;S.over=true;S.mode='quit';S.pending=null;S.sel=null;closePeek();

  R={stage:0,deck:[],cls:null};view='intro';render();scrollTo(0,0);
}

  if(view==='champ'){
    app.innerHTML=header()+`<div class="screen"><h2>${T('champTitle')}</h2><p>${T('champText',R.deck.length)}</p>
      <div class="btns"><button class="btn" data-go="newrun">${T('again')}</button></div></div>`;
  }
}

document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-choice],[data-mull],[data-t],[data-hand],[data-go],[data-pick],[data-hist],[data-class],[data-qclass],[data-add],[data-rm],[data-ftype],[data-fcost],[data-frar],[data-foe],[data-diff],[data-play],[data-edit],[data-del],[data-odeck],[data-zoom],[data-tal],[data-tpre],[data-btab],[data-tview],[data-pack]');
  if(!b||b.disabled)return;
  if(b.dataset.hist!==undefined)return peek(+b.dataset.hist);
  if(b.dataset.zoom!==undefined)return showZoom(b.dataset.zoom);
  if(b.dataset.tal!==undefined)return talClick(b.dataset.tal);
  if(b.dataset.pack!==undefined){const ps=advPacks();if(ps){ps[+b.dataset.pack].cards.forEach(k=>{if(fits(R.deck,k))R.deck.push(k)});R.stage++;goStage()}return}
  if(b.dataset.tpre!==undefined)return talPresetClick(b.dataset.tpre);
  if(b.dataset.btab!==undefined){Q.btab=b.dataset.btab;return render()}
  if(b.dataset.tview!==undefined){if(S){S.tview=b.dataset.tview;render()}return}
  if(b.dataset.go==='tclose'){if(S){S.tview=null;render()}return}
  if(b.dataset.go==='peekclose')return closePeek();
  if(b.dataset.t)return clickTarget(b.dataset.t);
  if(b.dataset.choice!==undefined){const c=S&&S.choice;if(c){const i=+b.dataset.choice;if(c.pick.has(i))c.pick.delete(i);else if(c.pick.size<c.n)c.pick.add(i);render()}return}
  if(b.dataset.mull!==undefined){const m=S&&S.mull;if(m&&!m.mine){const i=+b.dataset.mull;m.pick.has(i)?m.pick.delete(i):m.pick.add(i);render()}return}
  if(b.dataset.hand!==undefined){const i=+b.dataset.hand;
    // Landscape: the first tap previews a card; a spell that needs a target goes straight to choosing it.
    const hk=S&&S.p.hand[i],hc=hk&&CARDS[hk];
    const aim=hc&&hc.t==='s'&&hc.fx&&cardFx('p',hk).tgt&&canPay('p',hk)&&S.turn==='p'&&!S.busy&&!S.over;
    if(S&&S.pending&&S.pending.type==='spell'&&S.pending.idx===i){S.pending=null;return render()}
    if(LAND.matches&&S&&S.hsel!==i&&!S.pending&&!aim){S.hsel=i;return render()}
    if(S)S.hsel=null;return playHand(i)}
  if(b.dataset.pick!==undefined){R.deck.push(picks[+b.dataset.pick]);R.stage++;return goStage()}
  if(b.dataset.class!==undefined){introCls=b.dataset.class;view='hintro';render();scrollTo(0,0);return}
  if(b.dataset.qclass!==undefined)return openBuilder(b.dataset.qclass);
  if(b.dataset.add!==undefined){const k=b.dataset.add;
    if(Q.deck.length>=DECK_SIZE)Q.toast=T('deckFull');else if(copies(Q.deck,k)>=maxCopies(k))Q.toast=T('limitHit');else if(!fits(Q.deck,k))Q.toast=T('legLimit');else{Q.deck.push(k);Q.toast='';Q.dirty=true}
    return render()}
  if(b.dataset.rm!==undefined){const i=Q.deck.lastIndexOf(b.dataset.rm);if(i>=0){Q.deck.splice(i,1);Q.dirty=true}Q.toast='';return render()}
  if(b.dataset.play!==undefined)return playSaved(b.dataset.play);
  if(b.dataset.edit!==undefined){Q.delArm=null;return openBuilder(null,b.dataset.edit)}
  if(b.dataset.del!==undefined){const id=b.dataset.del;
    if(Q.delArm===id){const list=loadSaved(),d=list.find(x=>x.id===id);storeSaved(list.filter(x=>x.id!==id));Q.delArm=null;Q.libToast=d?T('deleted',d.name):'';if(Q.editId===id)Q.editId=null}
    else{Q.delArm=id;Q.libToast=''}
    return render()}
  if(b.dataset.ftype!==undefined){Q.type=b.dataset.ftype;return render()}
  if(b.dataset.fcost!==undefined){Q.cost=+b.dataset.fcost;return render()}
  if(b.dataset.frar!==undefined){Q.rar=Q.rar===b.dataset.frar?'all':b.dataset.frar;return render()}
  if(b.dataset.foe!==undefined){Q.foe=b.dataset.foe||null;return render()}
  if(b.dataset.diff!==undefined)return startQuick(b.dataset.diff);
  if(b.dataset.odeck!==undefined){O.sel=b.dataset.odeck;O.err='';return render()}
  const g=b.dataset.go;
  if(g==='gallery'){if(view!=='gallery'){prevView=view;view='gallery';render();scrollTo(0,0)}}
  else if(g==='back'){view=prevView;render()}
  else if(g==='start')goClass();
  else if(g==='retry')goStage();
  else if(g==='talgo')startDuel();
  else if(g==='end')endTurn();
  else if(g==='power')usePower();
  else if(g==='cancel'){S.pending=null;render()}
  else if(g==='skip'){R.stage++;goStage()}
  else if(g==='newrun')newRun();
  else if(g==='quick'||g==='qclassback')goQuick();
  else if(g==='menu'){netClose(true);newRun();scrollTo(0,0)}
  else if(g==='online')goOnline();
  else if(g==='onew'){Q.ret='online';goNewDeck()}
  else if(g==='oedit'){const d=curOnlineDeck();if(d){Q.ret='online';openBuilder(null,d.sid)}}
  else if(g==='ouse'){if(Q.deck.length===DECK_SIZE){if(Q.dirty||!Q.editId)saveCurrent(false);O.sel='s:'+Q.editId;Q.ret=null;goOnline()}}
  else if(g==='ohost')netStart(true);
  else if(g==='ojoin')joinTyped();
  else if(g==='ocancel'){netClose(true);O.toast='';render()}
  else if(g==='oshare')shareInvite();
  else if(g==='oagain')askRematch();
  else if(g==='oleave'){netClose(true);O.lost=null;newRun();scrollTo(0,0)}
  else if(g==='concede')concede();
  else if(g==='quit')quitDuel();
  else if(g==='mullok')mullConfirm();
  else if(g==='chooseok')chooseConfirm();
  else if(g==='autofill'){autoFill(Q.deck,Q.cls);Q.toast='';Q.dirty=true;render()}
  else if(g==='resetdeck'){Q.deck=[...CBY[Q.cls].deck];Q.toast='';Q.dirty=true;render()}
  else if(g==='cleardeck'){Q.deck=[];Q.toast='';Q.dirty=true;render()}
  else if(g==='savedeck'){saveCurrent(false);render()}
  else if(g==='saveasnew'){Q.name=(Q.name||'').trim()+(L==='en'?' (copy)':L==='zh'?'（副本）':'（コピー）');saveCurrent(true);render()}
  else if(g==='decks'){Q.libToast='';goQuick()}
  else if(g==='newdeck'){Q.libToast='';goNewDeck()}
  // Cards first, then the talents tab, then the difficulty; the difficulty screen steps back to the talents.
  // Talents, then cards, then the difficulty; the difficulty screen steps back to the cards.
  else if(g==='todiff'){if(Q.deck.length===DECK_SIZE){view='diff';render();scrollTo(0,0)}}
  else if(g==='startadv'){if(introCls)pickClass(introCls)}
  else if(g==='class'){view='class';render();scrollTo(0,0)}
  else if(g==='editdeck'){view='build';Q.btab='cards';render();scrollTo(0,0)}
  else if(g==='rematch')startQuick(Q.diff);
});
document.addEventListener('change',ev=>{
  if(ev.target.id!=='langsel')return;
  L=ev.target.value;try{localStorage.setItem('undertow-lang',L)}catch(e){}
  FX=[];if(S)S.drew=0;render();const n=$('#langsel');if(n)n.focus();
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closePeek();if(ev.key==='Enter'&&ev.target.id==='roomcode')joinTyped()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&NET)NET.last=Date.now()});
// Closing the tab tells the friend right away instead of waiting for the connection to time out.
addEventListener('pagehide',ev=>{if(NET&&!ev.persisted)netSend({t:'bye'})});
// Typing a deck name updates state without re-rendering, so the keyboard stays open.
document.addEventListener('input',ev=>{if(ev.target.id==='roomcode'){O.code=ev.target.value.replace(/\D/g,'').slice(0,6);if(ev.target.value!==O.code)ev.target.value=O.code;return}
  if(ev.target.id==='deckname'){Q.name=ev.target.value;if(!Q.dirty){Q.dirty=true;const b=document.querySelector('[data-go=savedeck]');if(b){b.classList.remove('ghost');b.textContent=T('saveDeck')}}}});
// Gentle 3D tilt for gallery cards.
document.addEventListener('pointermove',ev=>{
  if(RM)return;const c=ev.target.closest&&ev.target.closest('[data-tilt]');if(!c)return;
  const r=c.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width-.5,y=(ev.clientY-r.top)/r.height-.5;
  c.style.transform=`perspective(700px) rotateY(${x*16}deg) rotateX(${-y*16}deg) scale(1.04)`;
});
document.addEventListener('pointerout',ev=>{const c=ev.target.closest&&ev.target.closest('[data-tilt]');if(c&&!c.contains(ev.relatedTarget))c.style.transform=''});
// Long-press any card to see it full size (phones have no hover).
let lpT=null,lpFired=false,lpX=0,lpY=0;
function cardKeyOf(el){
  if(!el||!el.closest)return null;
  const h=el.closest('[data-hand]');if(h&&S&&S.p)return S.p.hand[+h.dataset.hand];
  const a=el.closest('[data-add]');if(a)return a.dataset.add;
  const pk=el.closest('[data-pick]');if(pk)return picks[+pk.dataset.pick];
  const t=el.closest('[data-t]');if(t&&t.dataset.t.includes(':m:')&&S){const o=getObj(t.dataset.t);return o?o.key:null}
  const z=el.closest('[data-zoom]');if(z)return z.dataset.zoom;
  const hc=el.closest('[data-hist]');if(hc&&S)return null;
  return null;
}
function showZoom(k){
  closePeek();const d=document.createElement('div');d.className='peek';d.dataset.go='peekclose';d.setAttribute('role','dialog');
  d.innerHTML=`<div class="peekbox">${cardFace(k,'big','div')}<p class="flav" style="color:var(--muted)">${cf(k)}</p><span class="hint">${T('tapClose')}</span></div>`;
  document.body.appendChild(d);
}
document.addEventListener('pointerdown',ev=>{
  if(ev.pointerType==='mouse')return;lpFired=false;const k=cardKeyOf(ev.target);if(!k)return;
lpX=ev.clientX;lpY=ev.clientY;clearTimeout(lpT);
  lpT=setTimeout(()=>{lpT=null;lpFired=true;showZoom(k);try{navigator.vibrate&&navigator.vibrate(10)}catch(e){}},430);
},{passive:true});
document.addEventListener('pointermove',ev=>{if(lpT&&Math.hypot(ev.clientX-lpX,ev.clientY-lpY)>10){clearTimeout(lpT);lpT=null}},{passive:true});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>{clearTimeout(lpT);lpT=null},{passive:true}));
document.addEventListener('click',ev=>{if(lpFired){lpFired=false;ev.stopPropagation();ev.preventDefault()}},true);
document.addEventListener('contextmenu',ev=>{if(cardKeyOf(ev.target))ev.preventDefault()});
initEmbers();
newRun();
// Test link: ?duel=<class>&hand=<n>&board=<n>&cards=<ids>&ehp=<n> starts an Adventure duel at once with extra cards in hand and minions on both boards (layout checks).
try{const q=new URLSearchParams(location.search),dc=q.get('duel');
  // ?intro=<class>: the Adventure hero introduction (layout checks)
  if(q.get('intro')&&CBY[q.get('intro')]){introCls=q.get('intro');view='hintro';render()}
  // ?classes=1: the new-deck class picker (layout checks)
  if(q.get('classes')){Q.ret=null;view='qclass';render()}
  // ?build=<class>[&rar=l]: the deck builder for that class (layout checks)
  if(q.get('build')&&CBY[q.get('build')]){openBuilder(q.get('build'));if(q.get('rar'))Q.rar=q.get('rar');Q.btab='cards';render();if(q.get('scroll'))setTimeout(()=>{const e=document.querySelector(q.get('scroll'));if(e)e.scrollIntoView()},400)}
  if(dc&&CBY[dc]){pickClass(dc);if(view==='tal')startDuel();if(+q.get('ehp'))S.e.hp=+q.get('ehp');const n=Math.min(9,+q.get('hand')||0);if(n)draw('p',n);
    const mins=CBY[dc].deck.filter(k=>CARDS[k].t==='m');for(let i=0;i<Math.min(5,+q.get('board')||0);i++){summon('p',mins[i%mins.length]);summon('e',mins[(i+3)%mins.length])}
    for(let i=0;i<Math.min(8,+q.get('hist')||0);i++)pushHist(i%2?'e':'p',mins[i%mins.length],null);
    // &cards=a,b,c: these cards go in your hand, and the minions among them also on both boards (art checks)
    (q.get('cards')||'').split(',').filter(k=>CARDS[k]).forEach(k=>{S.p.hand.unshift(k);if(CARDS[k].t==='m'){summon('p',k);summon('e',k)}});S.p.hand.splice(10);
    (q.get('fx')||'').split(',').forEach((f,i)=>{const m=S.e.board[i];if(!m)return;if(f==='ward')m.ward=true;if(f==='frozen')m.frozen=true;if(f==='silenced')silence(m)});
    if(q.get('sel')!=null)S.hsel=+q.get('sel');render()}}catch(e){}
// An invite link (?room=123456) opens straight into the friend-match lobby with the code filled in.
try{const rc=(new URLSearchParams(location.search).get('room')||'').replace(/\D/g,'');
  if(rc.length===6){O.code=rc;const u=new URL(location.href);u.searchParams.delete('room');history.replaceState(null,'',u.pathname+u.search+u.hash);goOnline()}}catch(e){}
})();
</script>
