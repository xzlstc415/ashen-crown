    if(LAND.matches&&S&&S.hsel!==i&&!S.pending){S.hsel=i;return render()}
    if(S)S.hsel=null;return playHand(i)}
  if(b.dataset.pick!==undefined){R.deck.push(picks[+b.dataset.pick]);R.stage++;return startDuel()}
  if(b.dataset.class!==undefined)return pickClass(b.dataset.class);
  if(b.dataset.qclass!==undefined)return openBuilder(b.dataset.qclass);
  if(b.dataset.add!==undefined){const k=b.dataset.add;
    if(Q.deck.length>=DECK_SIZE)Q.toast=T('deckFull');else if(copies(Q.deck,k)>=maxCopies(k))Q.toast=T('limitHit');else{Q.deck.push(k);Q.toast='';Q.dirty=true}
    return render()}
  if(b.dataset.rm!==undefined){const i=Q.deck.lastIndexOf(b.dataset.rm);if(i>=0){Q.deck.splice(i,1);Q.dirty=true}Q.toast='';return render()}
  if(b.dataset.play!==undefined)return playSaved(b.dataset.play);
  if(b.dataset.edit!==undefined){Q.delArm=null;return openBuilder(null,b.dataset.edit)}
  if(b.dataset.del!==undefined){const id=b.dataset.del;
    if(Q.delArm===id){const list=loadSaved(),d=list.find(x=>x.id===id);storeSaved(list.filter(x=>x.id!==id));Q.delArm=null;Q.libToast=d?T('deleted',d.name):'';if(Q.editId===id)Q.editId=null}
    else{Q.delArm=id;Q.libToast=''}
    return render()}
  if(b.dataset.ftype!==undefined){Q.type=b.dataset.ftype;return render()}
  if(b.dataset.fcost!==undefined){Q.cost=+b.dataset.fcost;return render()}
  if(b.dataset.diff!==undefined)return startQuick(b.dataset.diff);
  if(b.dataset.odeck!==undefined){O.sel=b.dataset.odeck;O.err='';return render()}
  const g=b.dataset.go;
  if(g==='gallery'){if(view!=='gallery'){prevView=view;view='gallery';render();scrollTo(0,0)}}
  else if(g==='back'){view=prevView;render()}
  else if(g==='start')goClass();
  else if(g==='retry')startDuel();
  else if(g==='end')endTurn();
  else if(g==='power')usePower();
  else if(g==='cancel'){S.pending=null;render()}
  else if(g==='skip'){R.stage++;startDuel()}
  else if(g==='newrun')newRun();
  else if(g==='quick'||g==='qclassback')goQuick();
  else if(g==='menu'){netClose(true);newRun();scrollTo(0,0)}
  else if(g==='online')goOnline();
  else if(g==='onew'){Q.ret='online';goNewDeck()}
  else if(g==='oedit'){const d=curOnlineDeck();if(d){Q.ret='online';openBuilder(null,d.sid)}}
  else if(g==='ouse'){if(Q.deck.length===DECK_SIZE){if(Q.dirty||!Q.editId)saveCurrent(false);O.sel='s:'+Q.editId;Q.ret=null;goOnline()}}
  else if(g==='ohost')netStart(true);
  else if(g==='ojoin')joinTyped();
  else if(g==='ocancel'){netClose(true);O.toast='';render()}
  else if(g==='oshare')shareInvite();
  else if(g==='oagain')askRematch();
  else if(g==='oleave'){netClose(true);O.lost=null;newRun();scrollTo(0,0)}
  else if(g==='concede')concede();
  else if(g==='autofill'){autoFill(Q.deck,Q.cls);Q.toast='';Q.dirty=true;render()}
  else if(g==='resetdeck'){Q.deck=[...CBY[Q.cls].deck];Q.toast='';Q.dirty=true;render()}
  else if(g==='cleardeck'){Q.deck=[];Q.toast='';Q.dirty=true;render()}
  else if(g==='savedeck'){saveCurrent(false);render()}
  else if(g==='saveasnew'){Q.name=(Q.name||'').trim()+(L==='en'?' (copy)':L==='zh'?'（副本）':'（コピー）');saveCurrent(true);render()}
  else if(g==='decks'){Q.libToast='';goQuick()}
  else if(g==='newdeck'){Q.libToast='';goNewDeck()}
  else if(g==='todiff'){if(Q.deck.length===DECK_SIZE){view='diff';render();scrollTo(0,0)}}
  else if(g==='editdeck'){view='build';render();scrollTo(0,0)}
  else if(g==='rematch')startQuick(Q.diff);
});
document.addEventListener('change',ev=>{
  if(ev.target.id!=='langsel')return;
  L=ev.target.value;try{localStorage.setItem('undertow-lang',L)}catch(e){}
  FX=[];if(S)S.drew=0;render();const n=$('#langsel');if(n)n.focus();
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closePeek();if(ev.key==='Enter'&&ev.target.id==='roomcode')joinTyped()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&NET)NET.last=Date.now()});
// Closing the tab tells the friend right away instead of waiting for the connection to time out.
addEventListener('pagehide',ev=>{if(NET&&!ev.persisted)netSend({t:'bye'})});
// Typing a deck name updates state without re-rendering, so the keyboard stays open.
document.addEventListener('input',ev=>{if(ev.target.id==='roomcode'){O.code=ev.target.value.replace(/\D/g,'').slice(0,6);if(ev.target.value!==O.code)ev.target.value=O.code;return}
  if(ev.target.id==='deckname'){Q.name=ev.target.value;if(!Q.dirty){Q.dirty=true;const b=document.querySelector('[data-go=savedeck]');if(b){b.classList.remove('ghost');b.textContent=T('saveDeck')}}}});
// Gentle 3D tilt for gallery cards.
document.addEventListener('pointermove',ev=>{
  if(RM)return;const c=ev.target.closest&&ev.target.closest('[data-tilt]');if(!c)return;
  const r=c.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width-.5,y=(ev.clientY-r.top)/r.height-.5;
  c.style.transform=`perspective(700px) rotateY(${x*16}deg) rotateX(${-y*16}deg) scale(1.04)`;
});
document.addEventListener('pointerout',ev=>{const c=ev.target.closest&&ev.target.closest('[data-tilt]');if(c&&!c.contains(ev.relatedTarget))c.style.transform=''});
// Long-press any card to see it full size (phones have no hover).
let lpT=null,lpFired=false,lpX=0,lpY=0;
function cardKeyOf(el){
  if(!el||!el.closest)return null;
  const h=el.closest('[data-hand]');if(h&&S&&S.p)return S.p.hand[+h.dataset.hand];
  const a=el.closest('[data-add]');if(a)return a.dataset.add;
  const pk=el.closest('[data-pick]');if(pk)return picks[+pk.dataset.pick];
  const t=el.closest('[data-t]');if(t&&t.dataset.t.includes(':m:')&&S){const o=getObj(t.dataset.t);return o?o.key:null}
  const hc=el.closest('[data-hist]');if(hc&&S)return null;
  return null;
}
function showZoom(k){
  closePeek();const d=document.createElement('div');d.className='peek';d.dataset.go='peekclose';d.setAttribute('role','dialog');
  d.innerHTML=`<div class="peekbox">${cardFace(k,'big','div')}<p class="flav" style="color:var(--muted)">${cf(k)}</p><span class="hint">${T('tapClose')}</span></div>`;
  document.body.appendChild(d);
}
document.addEventListener('pointerdown',ev=>{
  if(ev.pointerType==='mouse')return;lpFired=false;const k=cardKeyOf(ev.target);if(!k)return;
lpX=ev.clientX;lpY=ev.clientY;clearTimeout(lpT);
  lpT=setTimeout(()=>{lpT=null;lpFired=true;showZoom(k);try{navigator.vibrate&&navigator.vibrate(10)}catch(e){}},430);
},{passive:true});
document.addEventListener('pointermove',ev=>{if(lpT&&Math.hypot(ev.clientX-lpX,ev.clientY-lpY)>10){clearTimeout(lpT);lpT=null}},{passive:true});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>{clearTimeout(lpT);lpT=null},{passive:true}));
document.addEventListener('click',ev=>{if(lpFired){lpFired=false;ev.stopPropagation();ev.preventDefault()}},true);
document.addEventListener('contextmenu',ev=>{if(cardKeyOf(ev.target))ev.preventDefault()});
initEmbers();
newRun();
// Test link: ?duel=<class>&hand=<n>&board=<n>&cards=<ids> starts an Adventure duel at once with extra cards in hand and minions on both boards (layout checks).
try{const q=new URLSearchParams(location.search),dc=q.get('duel');
  if(dc&&CBY[dc]){pickClass(dc);const n=Math.min(9,+q.get('hand')||0);if(n)draw('p',n);
    const mins=CBY[dc].deck.filter(k=>CARDS[k].t==='m');for(let i=0;i<Math.min(5,+q.get('board')||0);i++){summon('p',mins[i%mins.length]);summon('e',mins[(i+3)%mins.length])}
    for(let i=0;i<Math.min(8,+q.get('hist')||0);i++)pushHist(i%2?'e':'p',mins[i%mins.length],null);
    // &cards=a,b,c: these cards go in your hand, and the minions among them also on both boards (art checks)
    (q.get('cards')||'').split(',').filter(k=>CARDS[k]).forEach(k=>{S.p.hand.unshift(k);if(CARDS[k].t==='m'){summon('p',k);summon('e',k)}});S.p.hand.splice(10);
    if(q.get('sel')!=null)S.hsel=+q.get('sel');render()}}catch(e){}
// An invite link (?room=123456) opens straight into the friend-match lobby with the code filled in.
try{const rc=(new URLSearchParams(location.search).get('room')||'').replace(/\D/g,'');
  if(rc.length===6){O.code=rc;const u=new URL(location.href);u.searchParams.delete('room');history.replaceState(null,'',u.pathname+u.search+u.hash);goOnline()}}catch(e){}
})();
</script>
