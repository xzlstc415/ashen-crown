<!doctype html>
<html lang="en">
<head>
<base href="../">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruinaccord (beta)</title>
<meta name="description" content="A fantasy card duel game. Pick a class, build a deck, and fight your way to the Ashen Crown. Plays in English, Chinese and Japanese.">
<meta name="theme-color" content="#141118">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ruinaccord">
<meta property="og:title" content="Ruinaccord">
<meta property="og:description" content="A fantasy card duel game for your phone and browser.">
<meta property="og:image" content="https://ruinaccord.hermes-eris.com/icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700;800&family=Noto+Serif+SC:wght@600&family=Noto+Serif+JP:wght@600&display=swap">
<style>
/* Layout: one-screen duel — top bar, enemy hero, enemy board, play history, log, your board, your hero, hand, end-turn bar.
   Single committed look: torchlit dungeon stone, parchment cards, ember and arcane accents. */
:root{
  color-scheme:dark;
  --bg:#141118; --panel:#221b26; --line:#3d3244;
  --ink:#ece3d0; --muted:#a69ba6;
  --parch:#efe2c2; --parch-ink:#2b2219;
  --ember:#e2763a; --kelp:#6aa57e; --foam:#a9c4ff; --gold:#d9b45a; --blood:#cf4a3f; --ready:#7fd17f; --arcane:#8f78e0;
  --display:"IM Fell English SC", "Noto Serif SC", "Noto Serif JP", "Songti SC", "Hiragino Mincho ProN", Georgia, serif;
  --body:"Alegreya Sans", "PingFang SC", "Hiragino Sans GB", "Hiragino Sans", "Yu Gothic", "Microsoft YaHei", "Meiryo", system-ui, sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;overflow-x:hidden;
  background-image:radial-gradient(110% 55% at 50% 45%, #2a2030 0%, transparent 70%)}
.embers{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.embers i{position:absolute;bottom:-12px;border-radius:50%;background:#f39a3a;box-shadow:0 0 6px 1px rgba(243,154,58,.7);animation:rise linear infinite;opacity:.7}
@keyframes rise{0%{transform:translate(0,0)}50%{opacity:.8}100%{transform:translate(var(--dx),-108vh);opacity:0}}
#app{position:relative;z-index:1;min-height:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:6px;box-sizing:border-box;
  padding-block:8px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.top{display:flex;align-items:center;gap:8px}
.brand{font-family:var(--display);font-size:21px;letter-spacing:.04em;color:var(--parch);flex:1;white-space:nowrap}
:is(:lang(zh),:lang(ja)) .brand{font-weight:600;font-size:19px}
.pill{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel);padding:0;font-size:12px;font-weight:700}
.pill span{padding:4px 9px;color:var(--muted)}
.langsel{appearance:none;-webkit-appearance:none;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--parch);
  font:700 12px var(--body);padding:4px 22px 4px 10px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 12px) 52%,calc(100% - 8px) 52%;background-size:4px 4px;background-repeat:no-repeat}
.langsel:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.langsel option{background:var(--panel);color:var(--ink)}
.stagepill{font-size:12px;font-weight:800;color:var(--ember);border:1.5px solid var(--ember);border-radius:999px;padding:2px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.routerow{display:flex;justify-content:center;padding-top:4px}
.route{display:flex;align-items:center;gap:3px}
.node{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:10px;font-weight:800;color:var(--muted)}
.node.done{background:var(--line);color:var(--ink)}
.node.here{border-color:var(--ember);color:var(--ember)}
.link{width:6px;height:1.5px;background:var(--line)}

.hero{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.face{position:relative;flex:none;width:50px;height:50px;border-radius:50%;border:2px solid #5a4a6a;
  background:radial-gradient(circle at 40% 35%, #4a3a5a, #1b1422);display:grid;place-items:center;font-family:var(--display);font-size:18px;padding:0}
.hero.foe .face{background:radial-gradient(circle at 40% 35%, #5a2a26, #1e0e0c);border-color:#6d3a33}
.hpb{position:absolute;right:-8px;bottom:-6px;min-width:24px;height:24px;border-radius:12px;background:var(--blood);color:#fff;font:800 13px var(--body);display:grid;place-items:center;padding:0 4px;font-variant-numeric:tabular-nums}
.arb{position:absolute;left:-8px;bottom:-6px;min-width:22px;height:22px;border-radius:6px;background:#5e6670;color:#fff;font:800 12px var(--body);display:grid;place-items:center}
.hinfo{flex:1;min-width:0;display:grid;gap:3px}
.hname{font-family:var(--display);font-size:17px;color:var(--parch);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
:is(:lang(zh),:lang(ja)) .hname{font-weight:600;font-size:16px}
.meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.crystals{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.crystals i{width:9px;height:12px;transform:skewX(-12deg);border-radius:2px;background:#2a2234;border:1px solid #3d3150;transition:background .3s}
.crystals i.on{background:#5aa3e0;border-color:#8cc4f0}
.crystals b{font-size:12px;margin-left:4px;color:#8cc4f0;font-variant-numeric:tabular-nums}
.crystals .sm{display:inline-flex;gap:2px;margin-left:6px}
.crystals .sm i{width:8px;height:8px;transform:rotate(45deg);border-radius:1px;background:#a77be8;border:1px solid #d2b8ff}
.power{flex:none;width:58px;height:58px;border-radius:50%;border:2px solid var(--gold);background:radial-gradient(circle at 40% 35%, #4a3a2a, #1e160f);
  font-size:10px;font-weight:700;line-height:1.15;display:grid;place-items:center;text-align:center;padding:4px;position:relative}
.power.foe{border-color:#6d3a33;opacity:.75}
.power .pc{z-index:1;position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;background:#2f6fa8;color:#fff;font-size:11px;display:grid;place-items:center}
.power .pn{display:block;max-width:50px}
.power[disabled]{opacity:.4;cursor:default}
.power:not([disabled]):not(.foe){animation:glowP 2s ease-in-out infinite}
@keyframes glowP{50%{box-shadow:0 0 12px rgba(217,180,90,.6)}}

.board{display:flex;justify-content:center;align-items:center;gap:8px;min-height:98px;padding:4px 0}
.board.empty::after{content:attr(data-empty);font-size:12px;color:var(--muted);opacity:.6}
.min{position:relative;width:60px;height:84px;flex:none;border-radius:14px 14px 10px 10px;border:2px solid #5a4a6a;
  background:linear-gradient(#3a3046,#211b29);display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 3px 0;transition:transform .15s}
.min.e{background:linear-gradient(#4a2826,#24130f);border-color:#6d3a33}
.mart{display:block;width:100%;height:32px;border-radius:10px 10px 4px 4px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#5a4636,#17110d)}
.mart svg{width:100%;height:100%;display:block}
.min.guard{border:3px solid var(--gold);border-radius:6px}
.min.guard .mart{border-radius:3px}
.min.ward{box-shadow:0 0 0 3px rgba(169,196,255,.6),0 0 14px rgba(169,196,255,.55);animation:wardPulse 2.4s ease-in-out infinite}
@keyframes wardPulse{50%{box-shadow:0 0 0 4px rgba(169,196,255,.35),0 0 20px rgba(169,196,255,.7)}}
.min.sleep{filter:saturate(.6) brightness(.85)}
.min.frozen{box-shadow:0 0 0 3px rgba(143,208,255,.85),inset 0 0 18px rgba(143,208,255,.55);filter:saturate(.7) hue-rotate(10deg)}
.min.silenced .mart{filter:grayscale(.85)}
.min.ready{outline:2px solid var(--ready);outline-offset:2px}
.min.sel{transform:translateY(-8px);outline:2px solid var(--ember);outline-offset:2px}
.min.enter{animation:enter .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes enter{from{transform:translateY(-36px) scale(.4);opacity:0}}
.target{outline:2px solid var(--blood)!important;outline-offset:2px;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{outline-color:transparent}}
.hit{animation:hit .38s ease-out}
@keyframes hit{20%{transform:translateX(-5px);filter:brightness(1.6) sepia(.6) saturate(3) hue-rotate(-30deg)}55%{transform:translateX(4px)}80%{transform:translateX(-2px)}}
.mn{font-size:9.5px;line-height:1.05;text-align:center;font-weight:800;overflow:hidden;max-height:20px}
.kw{font-size:8px;line-height:1.1;color:var(--gold);text-transform:uppercase;letter-spacing:.05em;text-align:center}
.z{position:absolute;top:-9px;right:-4px;font-size:11px;font-weight:800;color:var(--muted);animation:zz 1.6s ease-in-out infinite}
@keyframes zz{50%{transform:translateY(-3px);opacity:.5}}
.st{position:absolute;bottom:-7px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.st.a{left:-7px;background:var(--gold);color:#2a1d08}
.st.h{right:-7px;background:var(--blood);color:#fff}
.st.h.hurt{background:#8a1f18;color:#ffb3a9}
.st.h.up,.st.a.up{box-shadow:0 0 0 2px var(--ready)}

.mid{display:flex;align-items:center;justify-content:center;gap:10px;min-height:28px;font-size:13px;color:var(--muted);text-align:center}
.mid .btn{padding:5px 12px;font-size:12px}
.float{position:absolute;left:50%;top:-18px;transform:translateX(-50%);font-weight:800;font-size:20px;pointer-events:none;text-shadow:0 1px 3px #000;animation:up .9s ease-out forwards;white-space:nowrap;z-index:5}
@keyframes up{0%{transform:translateX(-50%) scale(1.5)}20%{transform:translateX(-50%) scale(1)}to{opacity:0;top:-48px}}

/* ---------- card face (sized in em; .sm hand, .md reward/reveal, .big gallery) ----------
   Full-art layout: the painting is the whole card, rules sit in a translucent box at the bottom. */
.card{position:relative;flex:none;width:10em;height:15.6em;padding:0;border:.28em solid #8a6a3a;border-radius:.9em;font-size:9.4px;
  background:#120d16;color:#f3e9d4;display:block;box-shadow:0 .25em 0 #0009;text-align:center;font-family:var(--body);transition:transform .15s}
.card.s{border-color:#6c58b8}
.card.leg{border-color:#e8b24a}
.card.md{font-size:10.8px}.card.big{font-size:14px}
.card .art{position:absolute;inset:0;border-radius:.62em;overflow:hidden;background:radial-gradient(circle at 50% 28%,#5a4636,#120d16 72%)}
.card.s .art{background:radial-gradient(circle at 50% 28%,#3d2f6e,#100a20 72%)}
.card.leg .art{background:radial-gradient(circle at 50% 28%,#6a2a1a,#1a0806 72%)}
.card .art svg{position:absolute;left:0;top:.45em;width:100%;height:auto;aspect-ratio:100/64;display:block}
.card .art img{width:100%;height:100%;object-fit:cover;display:block}
.card .cost{position:absolute;top:-.55em;left:-.5em;width:2em;height:2em;font-size:1.3em;font-weight:800;color:#fff;display:grid;place-items:center;z-index:2;
  background:radial-gradient(circle at 35% 30%,#7cb8ee,#2f6fa8);border:.1em solid #bfe0fa;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.card .tbox{position:absolute;left:.35em;right:.35em;bottom:.35em;min-height:40%;display:flex;flex-direction:column;align-items:center;gap:.18em;
  background:rgba(14,10,18,.66);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);border:.08em solid rgba(232,195,90,.35);
  border-radius:.5em;padding:.45em .4em 1.25em;line-height:1.22;color:#f3e9d4}
.card.s .tbox{padding-bottom:.55em}
.card .plate{font-family:var(--display);font-size:1.12em;line-height:1.1;color:#fff4dc;text-shadow:0 .08em .2em #000}
:is(:lang(zh),:lang(ja)) .card .plate{font-weight:600;font-size:1.04em;line-height:1.25}
.card .gem{position:absolute;top:-.42em;left:50%;margin-left:-.375em;width:.75em;height:.75em;transform:rotate(45deg);border:.1em solid #0009}
.gem.c{background:#e8e4da}.gem.r{background:#4f8fe0}.gem.e{background:#a35ad6}.gem.l{background:#f09a3a;box-shadow:0 0 .4em #f09a3a}.gem.t{background:#a69ba6}
.card .typ{font-size:.68em;letter-spacing:.1em;text-transform:uppercase;opacity:.72}
.card .tx b{font-weight:800;color:#ffe2a0}
.card .stat{position:absolute;bottom:-.45em;width:2em;height:2em;font-size:1.25em;font-weight:800;display:grid;place-items:center;font-variant-numeric:tabular-nums;z-index:2}
.card .stat.a{left:-.45em;background:radial-gradient(circle at 35% 30%,#f3d888,#b88a2a);color:#2a1d08;border-radius:50%;border:.08em solid #2a1d08}
.card .stat.h{right:-.45em;background:radial-gradient(circle at 35% 30%,#ec7a6c,#9a2a20);color:#fff;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;border:.08em solid #3a0a05}
.mart img,.hchip img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
.card.leg::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,transparent 35%,rgba(255,240,200,.35) 50%,transparent 65%);background-size:250% 100%;animation:shine 3.2s linear infinite}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}

.hand{display:flex;gap:7px;overflow-x:auto;padding:12px 6px 8px;margin-inline:-6px;scrollbar-width:thin}
.hand .card.play{box-shadow:0 0 0 .22em var(--ready),0 0 .9em rgba(127,209,127,.5),0 .25em 0 #0009}
.hand .card.play:hover,.hand .card.play:active{transform:translateY(-6px)}
.hand .card.off{filter:grayscale(.5) brightness(.65)}
.hand .card.pend{transform:translateY(-10px);box-shadow:0 0 0 .22em var(--ember),0 0 1em rgba(226,118,58,.6)}
.hand .card.drawn{animation:drawIn .45s cubic-bezier(.2,1.2,.4,1) backwards;animation-delay:var(--d,0ms)}
@keyframes drawIn{from{transform:translateX(80px) rotate(10deg);opacity:0}}

.foot{display:flex;align-items:center;gap:10px}
.foot .meta{flex:1}
.btn{background:var(--ember);color:#2a130a;border:none;border-radius:8px;padding:11px 18px;font-weight:800;font-size:15px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.glow{animation:glowB 1.4s ease-in-out infinite}
@keyframes glowB{50%{box-shadow:0 0 0 3px var(--ready),0 0 14px rgba(127,209,127,.6)}}
.btn[disabled]{opacity:.45;cursor:default}

.screen{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;text-align:center;padding-block:20px;animation:fadeUp .4s ease-out}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}
.screen h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0;color:var(--parch);text-wrap:balance}
:is(:lang(zh),:lang(ja)) .screen h2{font-weight:600;font-size:26px}
.screen p{margin:0 auto;color:var(--muted);max-width:44ch;line-height:1.5}
.rules{text-align:left;margin:0 auto;max-width:44ch;display:grid;gap:6px;padding:0;list-style:none;font-size:14px;line-height:1.5}
.rules li{padding-left:14px;position:relative}
.rules li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--ember)}
.rules b{color:var(--parch)}
.picks{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding-top:8px}
.picks .card:hover{transform:translateY(-6px)}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.fan{display:flex;justify-content:center;height:160px;margin-top:6px;overflow-x:clip;max-width:100%}
.fan .card{margin:0 -16px;transform-origin:50% 140%}

.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;width:100%;margin:0 auto;text-align:left}
.ccard{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;
  border-top:3px solid var(--cc);transition:transform .15s,border-color .15s;animation:fadeUp .35s ease-out backwards}
.ccard:hover{transform:translateY(-2px);border-color:var(--cc)}
.ccard:nth-child(2){animation-delay:.05s}.ccard:nth-child(3){animation-delay:.1s}.ccard:nth-child(4){animation-delay:.15s}.ccard:nth-child(5){animation-delay:.2s}.ccard:nth-child(6){animation-delay:.25s}
.cport{flex:none;width:64px;height:64px;border-radius:50%;overflow:hidden;border:2px solid var(--cc);background:radial-gradient(circle at 50% 40%,#3a3046,#140f18)}
.cport svg,.fart svg{width:100%;height:100%;display:block}
.ctext{display:grid;gap:4px;min-width:0}
.cname{font-family:var(--display);font-size:20px;color:var(--parch);line-height:1.1}
:is(:lang(zh),:lang(ja)) .cname{font-weight:600;font-size:18px}
.ctag{font-size:12.5px;color:var(--muted);line-height:1.35}
.cpow{display:flex;gap:8px;align-items:flex-start;margin-top:2px;font-size:13px;line-height:1.35}
.cpow .pc{flex:none;width:20px;height:20px;border-radius:50%;background:#2f6fa8;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;margin-top:1px}
.cpow b{color:var(--parch)}
.fart{position:absolute;inset:0;border-radius:50%;overflow:hidden}
.pcur b{color:var(--parch)}

/* ---------- menu, deck builder, difficulty ---------- */
.nav{display:flex;gap:8px;flex-wrap:wrap;padding-top:6px}
.dklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;width:100%;text-align:left}
.dk{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--cc);border-radius:12px;padding:12px}
.dk .cport{width:52px;height:52px}
.dkt{display:grid;gap:2px;min-width:0}
.dkt b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--parch);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
:is(:lang(zh),:lang(ja)) .dkt b{font-weight:600;font-size:16px}
.dkt span{font-size:12.5px;color:var(--muted)}
.dkt span.warn{color:var(--ember)}
.dkb{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.dkb .btn{padding:7px 12px;font-size:13px}
.btn.danger{border-color:var(--blood);color:#f0a097}
.namebar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.namebar input{flex:1;min-width:150px;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--parch);font:600 15px var(--body);padding:9px 11px;-webkit-user-select:text;user-select:text}
.namebar input:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.namebar .btn{padding:9px 12px;font-size:13px}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:22px;color:var(--muted);font-size:14px;line-height:1.5}
.nav .btn{padding:6px 12px;font-size:13px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;width:100%;max-width:640px;margin:0 auto}
.room{box-sizing:border-box;display:grid;gap:8px;justify-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;width:100%;max-width:420px;margin:0 auto}
.room .code{font:700 40px/1.1 var(--display);letter-spacing:.12em;color:var(--gold);-webkit-user-select:all;user-select:all}
.room p{margin:0}
.chip.odeck{border-left:3px solid var(--cc);font-size:12.5px;padding:6px 11px}
.netwarn{position:fixed;left:50%;top:calc(8px + env(safe-area-inset-top));transform:translateX(-50%);background:#3a1f1a;border:1px solid var(--ember);color:var(--parch);padding:6px 12px;border-radius:999px;font-size:12.5px;z-index:40;white-space:nowrap}
.foot .concede{padding:7px 10px;font-size:12.5px}
.mode{display:grid;gap:4px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;border-left:4px solid var(--cc,var(--ember));transition:transform .15s}
.mode:hover{transform:translateY(-2px)}
.mode b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--parch)}
:is(:lang(zh),:lang(ja)) .mode b{font-weight:600;font-size:18px}
.mode span{font-size:13px;color:var(--muted);line-height:1.4}
.bhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:6px}
.bhead h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0;color:var(--parch);flex:1;min-width:0}
:is(:lang(zh),:lang(ja)) .bhead h2{font-weight:600;font-size:21px}
.count{font-weight:800;font-variant-numeric:tabular-nums;border:1.5px solid var(--ember);color:var(--ember);border-radius:999px;padding:3px 10px;font-size:13px;white-space:nowrap}
.count.ok{border-color:var(--ready);color:var(--ready)}
.bnote{font-size:12.5px;color:var(--muted);margin:0;line-height:1.45}
.bwrap{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:600px){.bwrap{grid-template-columns:230px 1fr;align-items:start}.bdeck{position:sticky;top:max(8px,env(safe-area-inset-top,0px))}}
.bdeck{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px;min-width:0}
.curve{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;align-items:end;height:46px}
.curve i{display:block;background:#5aa3e0;border-radius:2px 2px 0 0;min-height:2px}
.curvel{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;font-size:10px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.dlist{display:grid;gap:3px;max-height:250px;overflow-y:auto;padding-right:2px}
@media (min-width:600px){.dlist{max-height:52vh}}
.drow{display:flex;align-items:center;gap:7px;background:#2c2432;border:1px solid var(--line);border-left:3px solid var(--rc,#e8e4da);border-radius:6px;padding:4px 7px;text-align:left;font-size:13px;min-width:0}
.drow:hover{border-color:var(--blood)}
.drow .dc{flex:none;width:20px;height:20px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;background:#2f6fa8;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.drow .dn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .dx{flex:none;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.bact{display:flex;gap:6px;flex-wrap:wrap}
.bact .btn{padding:7px 10px;font-size:12.5px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.chip.on{background:var(--line);color:var(--parch)}
.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:12px 8px;justify-items:center;padding:6px 0 20px}
.cslot{position:relative}
.cslot .badge{position:absolute;top:-6px;right:-6px;z-index:2;min-width:20px;height:20px;border-radius:10px;background:var(--ready);color:#10200f;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.cslot .card[disabled]{filter:grayscale(.7) brightness(.55);cursor:default}
.bfoot{position:sticky;bottom:0;z-index:5;display:flex;gap:10px;align-items:center;justify-content:space-between;background:linear-gradient(transparent,var(--bg) 30%);
  padding-top:18px;padding-bottom:max(8px,env(safe-area-inset-bottom,0px))}
.toast{min-height:18px;font-size:12.5px;color:var(--ember)}

/* ---------- gallery ---------- */
.ghead{display:flex;align-items:center;gap:12px;padding-top:6px}
.ghead h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0;color:var(--parch);flex:1}
:is(:lang(zh),:lang(ja)) .ghead h2{font-weight:600;font-size:23px}
.gsub{font-size:13px;color:var(--muted);margin:0}
.gsec{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:14px 0 2px;font-weight:800}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 12px;padding:12px 0 24px}
.gitem{display:grid;justify-items:center;gap:8px;min-width:0}
.gmeta{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.flav{margin:0;font-size:12.5px;font-style:italic;line-height:1.4;color:#c4b9c0;text-align:center;max-width:15em}

/* ---------- effect layers ---------- */
.orb{position:fixed;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,#fff 15%,var(--c) 50%,transparent 72%);box-shadow:0 0 16px 5px var(--c);z-index:30;pointer-events:none}
.burst{position:fixed;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:3px solid var(--c,#f3c97a);pointer-events:none;z-index:30}
.spark{position:fixed;border-radius:50%;background:#f39a3a;box-shadow:0 0 6px #f39a3a;pointer-events:none;z-index:30}
.wave{position:fixed;border-radius:12px;pointer-events:none;z-index:30;background:linear-gradient(90deg,transparent,rgba(243,154,58,.65),transparent);background-size:45% 100%;background-repeat:no-repeat}
.banner{position:fixed;left:0;right:0;top:40%;z-index:40;pointer-events:none;text-align:center;font-family:var(--display);font-size:30px;color:var(--parch);
  padding:12px 0;background:linear-gradient(90deg,transparent,rgba(20,17,24,.94) 22%,rgba(20,17,24,.94) 78%,transparent);border-block:1.5px solid var(--gold)}
:is(:lang(zh),:lang(ja)) .banner{font-weight:600;letter-spacing:.2em}
.banner.foe{border-color:var(--blood);color:#f0b0a6}
.reveal{position:fixed;left:50%;top:12%;z-index:35;pointer-events:none;filter:drop-shadow(0 10px 24px #000c);transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:8px}
.rcap,.rtgt{font-size:13px;font-weight:800;padding:3px 12px;border-radius:999px;white-space:nowrap}
.rcap{color:#f0b0a6;background:rgba(20,17,24,.92);border:1px solid #7a3f39}
.reveal.me .rcap,.peek .rcap.me{color:var(--ready);border-color:var(--kelp)}
.rtgt{color:#fff;background:rgba(207,74,63,.9)}
.aimed{outline:3px solid var(--blood)!important;outline-offset:3px;box-shadow:0 0 18px rgba(207,74,63,.85)!important;animation:pulse .5s ease-in-out infinite}
.hist{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;min-height:30px}
.hlab{font-size:11px;color:var(--muted);margin-right:4px}
.hchip{width:30px;height:30px;padding:0;border-radius:7px;overflow:hidden;border:2px solid var(--kelp);background:radial-gradient(circle at 50% 40%,#3a3046,#17121c)}
.hchip svg{width:100%;height:100%;display:block;transform:scale(1.5)}
.hchip.foe{border-color:#a0483f;background:radial-gradient(circle at 50% 40%,#4a2a2a,#1a0c0c)}
.hchip.fresh{animation:fresh 1.6s ease-in-out infinite}
@keyframes fresh{50%{box-shadow:0 0 0 2px var(--blood),0 0 10px rgba(207,74,63,.75)}}
.peek{position:fixed;inset:0;z-index:50;background:rgba(10,8,12,.82);display:grid;place-items:center;cursor:pointer;
  padding-block:16px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.peekbox{display:flex;flex-direction:column;align-items:center;gap:10px}
.peek .hint{font-size:12px;color:var(--muted)}
/* ---------- phones ---------- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:clip}
body{overflow-x:clip}
body{overscroll-behavior-y:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,select,.card{touch-action:manipulation}
svg{-webkit-user-drag:none}
@media (hover:none){
  .hand .card.play:hover,.picks .card:hover,.pcard:hover,.ccard:hover,.mode:hover{transform:none}
  .drow:hover{border-color:var(--line)}
}
@media (max-width:360px){
  #app{gap:4px}.brand{font-size:18px}.top{gap:6px}
  .card.sm{font-size:8.6px}.min{width:54px;height:80px}.board{gap:6px}
  .hero{padding:5px 8px;gap:8px}.face{width:44px;height:44px}.power{width:52px;height:52px;font-size:9.5px}
  .coll{grid-template-columns:repeat(auto-fill,minmax(86px,1fr))}
}
@media (max-height:700px) and (max-width:520px){
  .board{min-height:90px;padding:2px 0}.hist{min-height:26px}.hchip{width:26px;height:26px}.hand{padding-top:10px}.mid{min-height:22px}
}
.rotate{display:none}
/* ---------- landscape duel: slim status rail | board | preview + hand ---------- */
#app.duelland{max-width:none;height:100vh;height:100dvh;min-height:0;display:grid;grid-template-columns:72px minmax(340px,1fr) minmax(240px,1.15fr);
  gap:10px;overflow:hidden;padding:6px max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px))}
.lrail{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:0}
.lhero{display:flex;flex-direction:column;align-items:center;gap:5px}
.lhero.me{flex-direction:column-reverse}
.lhero .face{width:46px;height:46px}
.lhero .hpb{right:-9px;bottom:-5px;min-width:22px;height:22px;font-size:12px}
.lhero .arb{left:-9px;bottom:-5px;min-width:20px;height:20px;font-size:11px}
.lrow{display:flex;align-items:center;gap:5px}
.lmana{position:relative;width:30px;height:34px;display:grid;place-items:center;clip-path:polygon(50% 0,100% 28%,100% 72%,50% 100%,0 72%,0 28%);
  background:linear-gradient(160deg,#7cb8ee,#2f6fa8);color:#fff;font:800 13px var(--body);line-height:1;font-variant-numeric:tabular-nums}
.lmana small{position:absolute;bottom:4px;font-size:8px;font-weight:700;opacity:.85}
.lmana.none{background:linear-gradient(160deg,#3d3150,#2a2234);color:#8c7fa0}
.lsm{display:flex;gap:2px;justify-content:center;height:6px}
.lsm i{width:6px;height:6px;transform:rotate(45deg);background:#a77be8;border:1px solid #d2b8ff}
.power.mini{width:32px;height:32px;font-size:0;border-width:2px}
.power.mini::before{content:"✦";font-size:15px;color:var(--gold)}
.power.mini .pc{top:-7px;width:16px;height:16px;font-size:10px}
.power.mini .pn{display:none}
.lhist{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;overflow:hidden}
.lhist .hchip.off{display:none}
.lhist .hchip{width:28px;height:28px;flex:none}
.endb{flex:none;width:42px;height:42px;border-radius:50%;border:2px solid #f3c97a;color:#fff;display:grid;place-items:center;padding:0;
  background:radial-gradient(circle at 40% 35%,#f0a060,#a8401a 70%);box-shadow:0 3px 0 #0008}
.endb svg{width:20px;height:20px}
.endb[disabled]{filter:grayscale(.85) brightness(.55);cursor:default}
.endb.glow{animation:glowE 1.4s ease-in-out infinite}
@keyframes glowE{50%{box-shadow:0 0 0 4px rgba(243,201,122,.35),0 0 18px rgba(243,160,96,.8)}}
.lboard{display:flex;flex-direction:column;justify-content:space-evenly;min-width:0;min-height:0}
.lboard .board{min-height:88px;padding:0}
.lboard .mid{min-height:20px;font-size:12.5px}
.lside{display:flex;flex-direction:column;min-width:0;min-height:0;gap:4px}
.lprev{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;font-size:12px;color:var(--muted)}
.lprev .card{font-size:clamp(7px,2.4vh,15px)}
.lprev .pbtns{display:flex;gap:8px;align-items:center}
.lprev .btn{padding:6px 14px;font-size:13px}
.lprev .who{display:grid;gap:2px;line-height:1.3}
.lprev .who b{color:var(--parch);font-family:var(--display);font-weight:400}
.lside .hand{flex:none;margin:0;padding:12px 4px 2px;overflow:visible;justify-content:center;gap:7px}
.lside .hand .card{font-size:clamp(6px,2.25vh,12.5px)}
.lside .hand .card+.card{margin-left:var(--ov,0px)}
.lside .hand .card:hover,.lside .hand .card.pend{z-index:5}
.lside .hand .card.hsel{transform:translateY(-10px);z-index:6;box-shadow:0 0 0 .22em var(--gold),0 0 .9em rgba(243,201,122,.6)}
.lflag{position:absolute;top:6px;right:10px;z-index:3}
/* taller screens (tablets, desktop): the same layout, scaled up */
@media (orientation:landscape) and (min-width:560px) and (min-height:520px){
  #app.duelland{zoom:1.35;height:calc(100dvh / 1.35)}
  #app.duelland .lside .hand .card{font-size:8.8px}#app.duelland .lprev .card{font-size:9.6px}
}
@media (orientation:landscape) and (min-width:560px) and (min-height:700px){
  #app.duelland{zoom:1.75;height:calc(100dvh / 1.75)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.embers{display:none}}
/* standalone page: safe areas top and bottom (the artifact viewer supplied these before) */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:15px}
[hidden]{display:none!important}
</style>

const CARDS={
  goblin:{c:1,t:'m',a:2,h:1,r:'c',race:'goblin',n:['Goblin Cutpurse','哥布林扒手','ゴブリンのスリ'],f:['Your purse was lighter than he hoped.','你的钱袋比他预想的还轻。','財布は期待より軽かった。']},
  pearl:{c:1,t:'m',a:1,h:1,r:'c',race:'human',ward:1,n:['Temple Acolyte','神殿侍僧','神殿の侍祭'],f:['Her prayers land before the blows do.','她的祷告总比拳头先到。','祈りは拳より先に届く。']},
  apprentice:{c:1,t:'m',a:1,h:1,r:'c',race:'human',bc:{dmg:1,tgt:'any'},n:["Wizard's Apprentice",'法师学徒','魔術師の弟子'],f:['Only singed the eyebrows. This time.','这次只烧掉了眉毛。','今回は眉毛が焦げただけ。']},
  crab:{c:2,t:'m',a:1,h:4,r:'c',race:'dwarf',guard:1,n:['Dwarf Shieldbearer','矮人盾卫','ドワーフの盾持ち'],f:['The shield is older than he is.','这面盾比他还老。','その盾は彼より年上だ。']},
  harpooneer:{c:2,t:'m',a:2,h:2,r:'c',race:'elf',bc:{dmg:1,tgt:'any'},n:['Elven Archer','精灵弓手','エルフの射手'],f:['She has never needed a second arrow.','她从来不需要第二支箭。','二本目の矢は必要なかった。']},
  direwolf:{c:2,t:'m',a:3,h:2,r:'c',race:'beast',n:['Dire Wolf','恐狼','ダイアウルフ'],f:['The pack is never far behind.','狼群从不远离。','群れはすぐ後ろにいる。']},
  cleric:{c:3,t:'m',a:3,h:4,r:'c',race:'dwarf',bc:{heal:4},n:['Dwarven Cleric','矮人牧师','ドワーフの僧侶'],f:['Prayer, ale, and a very large hammer.','祷告、麦酒，还有一把很大的锤子。','祈りとエールと、とても大きなハンマー。']},
  berserker:{c:2,t:'m',a:2,h:1,r:'c',race:'orc',surge:1,n:['Orc Berserker','兽人狂战士','オークの狂戦士'],f:['Thinks with his axe. Thinks fast.','用斧头思考，而且想得很快。','斧で考える。考えるのは速い。']},
  burglar:{c:2,t:'m',a:2,h:2,r:'r',race:'halfling',bc:{draw:1},n:['Halfling Burglar','半身人窃贼','ハーフリングの泥棒'],f:['Finders keepers.','谁捡到就是谁的。','見つけた者の物。']},
  eel:{c:3,t:'m',a:3,h:2,r:'r',race:'orc',surge:1,n:['Orc Raider','兽人掠夺者','オークの略奪者'],f:['First through the gate. Always.','永远第一个冲进城门。','門をくぐるのはいつも一番乗り。']},
  lurker:{c:4,t:'m',a:4,h:5,r:'c',race:'troll',n:['Forest Troll','森林巨魔','森のトロール'],f:['Leave a toll, or become one.','留下买路钱，或者把你自己留下。','通行料を置いていけ。さもなくばお前が通行料だ。']},
  sailor:{c:2,t:'m',a:1,h:2,r:'r',race:'undead',gasp:'bubble',n:['Grave Thrall','墓穴仆从','墓所の下僕'],f:['Death was only a change of employer.','死亡只是换了个雇主。','死は雇い主が変わっただけ。']},
  beastcaller:{c:3,t:'m',a:2,h:3,r:'r',race:'elf',bc:{summon:'elver'},n:['Elven Beastcaller','精灵驯兽师','エルフの獣使い'],f:['She whistles once. Something always answers.','她吹一声口哨，总会有东西回应。','口笛ひとつで、必ず何かが応える。']},
  ghoul:{c:3,t:'m',a:3,h:3,r:'c',race:'undead',gasp:'bubble',n:['Barrow Ghoul','古墓食尸鬼','塚の食屍鬼'],f:['Hungry even after the end.','死后依旧饥饿。','終わりの後も飢えている。']},
  alchemist:{c:3,t:'m',a:2,h:2,r:'r',race:'gnome',bc:{buff:[2,0],tgt:'ally'},n:['Gnome Alchemist','侏儒炼金师','ノームの錬金術師'],f:["Drink this. Don't ask what's in it.",'喝了它。别问里面是什么。','これを飲め。中身は聞くな。']},
  knight:{c:4,t:'m',a:3,h:5,r:'r',race:'human',guard:1,n:['Paladin Vanguard','圣骑士先锋','聖騎士の先鋒'],f:['Behind her, no one falls.','在她身后，无人倒下。','彼女の後ろで倒れる者はいない。']},
  diver:{c:4,t:'m',a:3,h:4,r:'r',race:'gnome',bc:{draw:1},n:['Gnome Tinkerer','侏儒工匠','ノームの技師'],f:['It works. Mostly. Twice so far.','它能用。大部分时候。目前成功过两次。','動く。たいてい。今のところ二回は。']},
  gull:{c:5,t:'m',a:4,h:4,r:'e',race:'beast',surge:1,n:['Griffon Rider','狮鹫骑士','グリフォンライダー'],f:['Arrives before the war horns finish.','战号还没吹完，他就到了。','角笛が鳴り終わる前に到着する。']},
  commander:{c:5,t:'m',a:4,h:5,r:'e',race:'human',bc:{team:[1,0]},n:['Knight Commander','骑士指挥官','騎士団長'],f:['Hold the line, then break theirs.','守住阵线，再冲破他们的。','戦線を守れ。それから奴らのを崩せ。']},
  golem:{c:5,t:'m',a:2,h:8,r:'c',race:'construct',guard:1,n:['Stone Golem','石魔像','ストーンゴーレム'],f:['It was told to guard the door. The door is long gone.','它被命令守门，可那扇门早就没了。','扉を守れと命じられた。扉はとうに無い。']},
  shark:{c:6,t:'m',a:6,h:6,r:'e',race:'giant',ward:1,n:['Runebound Giant','符文巨人','ルーンの巨人'],f:['Every rune is a spell someone wasted on it.','每道符文，都是有人白费在它身上的法术。','ルーンの一つ一つが、誰かが無駄にした呪文だ。']},
  firelem:{c:6,t:'m',a:5,h:5,r:'r',race:'elemental',bc:{dmg:3,tgt:'any'},n:['Fire Elemental','火元素','炎の精霊'],f:['Do not offer it a hand to shake.','千万别向它伸手握手。','握手を求めてはいけない。']},
  ogre:{c:6,t:'m',a:6,h:7,r:'c',race:'giant',n:['Ogre Brute','食人魔蛮兵','オーガの蛮兵'],f:['Two heads would be smarter. He has one.','两个脑袋会聪明些，可他只有一个。','頭が二つなら賢かったろう。彼には一つしかない。']},
  archmage:{c:7,t:'m',a:6,h:7,r:'e',race:'human',bc:{draw:2},n:['Archmage of the Spire','尖塔大法师','尖塔の大魔導師'],f:['She has read every book in the tower. Twice.','塔里的每本书她都读过两遍。','塔の本は全て読んだ。二度ずつ。']},
  hexer:{c:4,t:'m',a:3,h:4,r:'c',race:'orc',bc:{dmg:2,tgt:'any'},n:['Orc Hexer','兽人妖术师','オークの呪術師'],f:['Every curse is a promise kept.','每一道诅咒，都是兑现的承诺。','呪いはすべて、守られた約束だ。']},
  priestess:{c:4,t:'m',a:3,h:4,r:'r',race:'human',bc:{buff:[2,2],tgt:'ally'},n:['Temple Priestess','神殿祭司','神殿の司祭'],f:['She blesses the brave and the foolish alike.','无论勇敢还是愚蠢，她一视同仁地祝福。','勇者にも愚者にも、等しく祝福を。']},
  necro:{c:4,t:'m',a:3,h:3,r:'r',race:'human',bc:{summon:'bubble'},n:['Necromancer','死灵法师','ネクロマンサー'],f:['Nobody stays dead on his watch.','在他看守下，没人能安息。','彼の見張りの下では、誰も死んだままでいられない。']},
  thane:{c:5,t:'m',a:5,h:5,r:'r',race:'dwarf',bc:{armor:4},n:['Dwarf Thane','矮人领主','ドワーフの領主'],f:['His hall has never fallen. Neither has he.','他的大厅从未陷落，他本人也是。','彼の広間は一度も落ちていない。彼自身もだ。']},
  wyvern:{c:6,t:'m',a:5,h:5,r:'e',race:'dragon',surge:1,n:['Wyvern Rider','双足飞龙骑手','ワイバーンライダー'],f:['The sky is just another road.','天空只是另一条路。','空もまた、ただの道だ。']},
  treant:{c:7,t:'m',a:6,h:9,r:'r',race:'treant',guard:1,n:['Ancient Treant','远古树人','古の樹人'],f:['It was old when the first king was crowned.','第一位国王加冕时，它就已经很老了。','最初の王が戴冠した時、すでに老いていた。']},
  dragonknight:{c:7,t:'m',a:5,h:5,r:'e',race:'human',gasp:'spawn',n:['Dragon Knight','龙骑士','竜騎士'],f:['When he falls, his dragon does not.','他倒下时，他的龙不会。','彼が倒れても、竜は倒れない。']},
  leviathan:{c:8,t:'m',a:7,h:8,r:'l',race:'dragon',guard:1,bc:{aoe:2},n:['Ignaroth, Ashen Wyrm','灰烬巨龙伊格纳洛斯','灰燼竜イグナロス'],f:['The crown was forged in his breath.','那顶王冠，正是在他的龙息中锻成。','王冠は彼の吐息で鍛えられた。']},
  lich:{c:8,t:'m',a:6,h:6,r:'l',race:'undead',bc:{aoe:3,face:3},n:['Malakar the Undying','不朽者马拉卡','不死のマラカル'],f:['He has died eleven times. He is getting better at it.','他已经死过十一次了，而且越来越熟练。','十一度死んだ。だんだん上手くなっている。']},
  dwarfking:{c:8,t:'m',a:7,h:7,r:'l',race:'dwarf',guard:1,bc:{armor:5,team:[1,1]},n:['Thorgrim, King Under Stone','石下之王索格林','石下の王ソーグリム'],f:['His beard has its own throne.','他的胡子都有自己的王座。','彼の髭には専用の玉座がある。']},
  elfqueen:{c:8,t:'m',a:5,h:7,r:'l',race:'elf',ward:1,bc:{heal:8,draw:2},n:['Sylvara, Queen of the Glade','林地女王希尔瓦拉','森の女王シルヴァラ'],f:['The forest kneels when she walks.','她走过时，森林为之屈膝。','彼女が歩けば、森がひざまずく。']},
  spray:{c:1,t:'s',r:'c',fx:{dmg:2,tgt:'any'},n:['Fire Bolt','火焰箭','ファイアボルト'],f:['The first spell every apprentice learns.','每个学徒学会的第一个法术。','見習いが最初に覚える呪文。']},
  brace:{c:1,t:'s',r:'c',fx:{buff:[0,3],guard:1,tgt:'ally'},n:['Shield of Faith','信仰之盾','信仰の盾'],f:['Belief, hammered into steel.','把信念锻打成钢。','信念を鋼に打ち込む。']},
  darkpact:{c:1,t:'s',r:'r',fx:{selfDmg:3,draw:2},n:['Dark Pact','黑暗契约','闇の契約'],f:['Sign here. And here. And in blood, here.','在这里签字。这里也是。还有这里，用血签。','ここに署名を。ここにも。そしてここは血で。']},
  frenzy:{c:2,t:'s',r:'r',fx:{buff:[3,0],tgt:'ally'},n:['Bloodlust','嗜血','血の渇き'],f:['One taste is enough.','尝一口就够了。','一口で十分だ。']},
  tidepool:{c:3,t:'s',r:'c',fx:{draw:2},n:["Scholar's Insight",'学者的洞见','賢者の洞察'],f:['Footnotes are where the real magic hides.','真正的魔法都藏在脚注里。','本当の魔法は脚注に隠れている。']},
  mend:{c:2,t:'s',r:'r',fx:{heal:6},n:['Healing Light','治愈之光','癒しの光'],f:['Warm as a hearth, quick as a prayer.','像炉火一样温暖，像祷告一样迅速。','暖炉のように温かく、祈りのように速い。']},
  shieldwall:{c:2,t:'s',r:'c',fx:{armor:4},n:['Shield Wall','盾墙','盾の壁'],f:['Lock shields. Lock eyes. Hold.','盾牌相扣，目光相接，守住。','盾を組め。目を据えろ。踏みとどまれ。']},
  calltoarms:{c:3,t:'s',r:'c',fx:{summon:['minnow','minnow','minnow']},n:['Call to Arms','战斗号令','召集令'],f:['Farmers today. Heroes, maybe, tomorrow.','今天是农夫，明天也许就是英雄。','今日は農夫。明日は、たぶん英雄。']},
  undertow:{c:3,t:'s',r:'r',fx:{dmg:4,tgt:'minion'},n:['Smite','惩击','天罰'],f:['Judgment, delivered from above.','来自天上的审判。','天上より下される裁き。']},
  radiant:{c:3,t:'s',r:'r',fx:{aoe:1,heal:4},n:['Radiant Burst','光耀爆发','光輝の爆発'],f:['Light that burns the wicked and warms the faithful.','灼烧邪恶、温暖信徒的光。','悪を焼き、信じる者を温める光。']},
  hymn:{c:3,t:'s',r:'r',fx:{team:[1,1]},n:['Battle Hymn','战歌','戦いの賛歌'],f:['Off-key, but very loud.','跑调了，但非常响亮。','音程は外れているが、とても大きい。']},
  lance:{c:4,t:'s',r:'r',fx:{dmg:3,tgt:'minion',draw:1},n:['Arcane Lance','奥术长枪','秘術の槍'],f:['Pierce, then ponder.','先刺穿，再思考。','貫いてから、考えよ。']},
  maelstrom:{c:4,t:'s',r:'e',fx:{aoe:2},n:['Fireball','火球术','ファイアボール'],f:['Aim for the middle.','瞄准中间就行。','真ん中を狙え。']},
  riptide:{c:5,t:'s',r:'e',fx:{dmg:6,tgt:'any'},n:['Lightning Bolt','闪电箭','ライトニングボルト'],f:['Never strikes the same place twice. Never needs to.','从不劈同一个地方两次，也从不需要。','同じ場所に二度は落ちない。その必要もない。']},
  breath:{c:6,t:'s',r:'e',fx:{aoe:3,face:3},n:["Dragon's Breath",'龙息','竜の息吹'],f:['The last thing the castle walls ever felt.','城墙感受到的最后一样东西。','城壁が最後に感じたもの。']},
  inferno:{c:6,t:'s',r:'e',fx:{aoe:4},n:['Inferno','炼狱烈焰','業火'],f:['Nothing grows here anymore. Nothing will.','这里已寸草不生，以后也不会再有。','もう何も育たない。これからも。']},
  // ---- class spells (cls: only that class may use them; x: rules text in every language) ----
  innerrage:{c:0,t:'s',r:'c',cls:'warrior',fx:{dmg:1,buff:[2,0],tgt:'minion'},n:['Inner Rage','怒火中烧','内なる怒り'],x:['Deal 1 damage to a minion and give it +2 Attack.','对一个随从造成1点伤害，并使其获得+2攻击力。','ミニオン1体に1ダメージを与え、攻撃力+2を付与する。'],f:['Pain is a fine whetstone.','痛苦是最好的磨刀石。','痛みは良い砥石だ。']},
  whirlwind:{c:1,t:'s',r:'c',cls:'warrior',fx:{sweep:1},n:['Whirlwind','旋风斩','旋風斬り'],x:['Deal 1 damage to ALL minions.','对所有随从造成1点伤害。','全てのミニオンに1ダメージを与える。'],f:['Friends should stand further back.','朋友们最好站远一点。','味方はもっと離れて立つべきだ。']},
  shieldslam:{c:1,t:'s',r:'e',cls:'warrior',fx:{armorDmg:1,tgt:'minion'},n:['Shield Slam','盾牌猛击','シールドスラム'],x:['Deal damage to a minion equal to your Armor.','对一个随从造成等同于你护甲值的伤害。','ミニオン1体に、自分の装甲と同じだけのダメージを与える。'],f:['The best defense is a very heavy offense.','最好的防守，是非常沉重的进攻。','最大の防御は、とても重い攻撃だ。']},
  execute:{c:2,t:'s',r:'r',cls:'warrior',fx:{destroy:1,cond:'damaged',tgt:'foe'},n:['Execute','斩杀','処刑'],x:['Destroy a damaged enemy minion.','消灭一个受伤的敌方随从。','ダメージを受けている敵のミニオン1体を破壊する。'],f:['Finish what you started.','把开始的事做完。','始めたことは終わらせろ。']},
  missiles:{c:1,t:'s',r:'c',cls:'mage',fx:{aoe:1,face:1},n:['Arcane Missiles','奥术飞弹','アーケインミサイル'],f:['Not aimed. Not needed.','无需瞄准，也不需要瞄准。','狙いは要らない。'] },
  mirror:{c:1,t:'s',r:'c',cls:'mage',fx:{summon:['mirrorimg','mirrorimg']},n:['Mirror Image','镜像','ミラーイメージ'],x:['Summon two 0/2 Mirror Images with Guard.','召唤两个0/2并具有守护的镜像。','ガードを持つ0/2のミラーイメージを2体召喚する。'],f:['Which one is real? Neither.','哪个是真的？都不是。','どれが本物？どれでもない。']},

function fxText(fx,tgt){
  const F=I18N[L].fx,out=[];
  if(fx.selfDmg)out.push(F.self(fx.selfDmg));
  if(fx.dmg)out.push(F.dmg(fx.dmg,tgt==='minion'));
  if(fx.aoe)out.push(fx.face?F.aoeAll(fx.aoe):F.aoe(fx.aoe));
  else if(fx.face)out.push(F.face(fx.face));
  if(fx.healT)out.push(F.healT(fx.healT));
  if(fx.buff)out.push(F.buff(F.stat(fx.buff[0],fx.buff[1]),fx.guard,fx.ward));
  if(fx.team)out.push(F.team(F.stat(fx.team[0],fx.team[1])));
  if(fx.summon){const a=[].concat(fx.summon),c=CARDS[a[0]];out.push(F.summon(a.length,c.a,c.h,cn(a[0])))}
  if(fx.heal)out.push(F.heal(fx.heal));
  if(fx.armor)out.push(F.armor(fx.armor));
  if(fx.draw)out.push(F.draw(fx.draw));
  if(fx.mana)out.push(F.mana(fx.mana));
  return out.join(F.sep);
}
function cardText(k){
  const c=CARDS[k],F=I18N[L].fx;
  if(c.x)return c.x[li()];
  const kws=['guard','ward','surge'].filter(x=>c[x]).map(x=>F.kw[x]);
  let s=kws.length?kws.join(F.kwSep)+F.end:'';
  if(c.bc)s+=(s?F.sep:'')+F.onPlay+fxText(c.bc,c.bc.tgt);
  if(c.gasp){const g=CARDS[c.gasp];s+=(s?F.sep:'')+F.last+F.summon(1,g.a,g.h,cn(c.gasp))}
  if(c.fx)s+=fxText(c.fx,c.fx.tgt);
  return s;
}

function rollRewards(stage){
  const w={c:3,r:2,e:1,l:stage>=2?1:0},pool=[];
  COLLECT.filter(k=>forCls(k,R.cls)).forEach(k=>{for(let i=0;i<w[CARDS[k].r];i++)pool.push(k)});

}

function newRun(){R={stage:0,deck:[],cls:null};S=null;view='intro';render()}

  else{Q.cls=cls;Q.deck=[...CBY[cls].deck];Q.editId=null;Q.name=nextDefaultName(cls)}

function playSaved(id){const d=loadSaved().find(x=>x.id===id);if(!d||d.cards.length!==DECK_SIZE)return;
  Q.cls=d.cls;Q.deck=[...d.cards];Q.editId=d.id;Q.name=d.name;Q.dirty=false;view='diff';render();scrollTo(0,0)}
function startQuick(diff){

  const mk=(side,hp,deck)=>({side,hp,max:hp,armor:0,mana:0,maxMana:0,sm:0,deck:shuffle([...deck]),hand:[],board:[],fat:0,powerUsed:false});
  S={mode:'quick',diff,ecls,turn:'p',over:false,busy:false,pending:null,sel:null,log:null,drew:0,hist:[],round:0,
     p:mk('p',30,Q.deck),e:mk('e',30,padDeck(CBY[ecls].deck,DIFFS[diff].rar,ecls))};
  S.e.power=CBY[ecls].power;
  const pFirst=Math.random()<.5;
  view='duel';
  if(pFirst){draw('p',3);draw('e',4);S.e.hand.push('coin');say('goFirst');startTurn('p');render();banner(T('bannerYou'))}
  else{draw('e',3);draw('p',4);S.p.hand.push('coin');say('goSecond');S.turn='e';render();aiTurn()}
}
function goClass(){view='class';render();scrollTo(0,0)}
function pickClass(id){R.cls=id;R.deck=[...CBY[id].deck];startDuel()}
const curPower=()=>CBY[R.cls].power;
function powerBlocked(){
  const p=curPower(),me=S.p;
  if(S.turn!=='p'||S.busy||S.over||S.pending||me.powerUsed||me.mana<p.c)return true;
  if(p.fx.summon&&me.board.length>=BOARD_MAX)return true;
  if(p.tgt&&!targetsFor('p',p.tgt).length)return true;
  return false;
}
function startDuel(){
  const o=OPP[R.stage];
  const mk=(side,hp,deck)=>({side,hp,max:hp,armor:0,mana:0,maxMana:0,sm:0,deck:shuffle([...deck]),hand:[],board:[],fat:0,powerUsed:false});
  S={mode:'camp',turn:'p',over:false,busy:false,pending:null,sel:null,log:null,drew:0,hist:[],round:0,p:mk('p',30,R.deck),e:mk('e',o.hp,o.deck)};
  S.e.maxMana=o.ramp||0;S.e.power=FORTIFY;
  say('rises',()=>heroName(S.e));
  draw('p',3);draw('e',4);S.e.hand.push('coin');
  view='duel';startTurn('p');render();banner(T('bannerYou'));
}
function startTurn(side){
  const s=S[side],o=S[other(side)];
  // The side whose turn just ended banks its unspent mana as spell mana (up to 3), its frozen minions thaw
  // and temporary Attack wears off. Minions frozen during the other turn sit this turn out.
  o.sm=Math.min(3,(o.sm||0)+Math.max(0,o.mana));o.mana=0;
  o.board.forEach(m=>{m.frozen=false;if(m.tmp){m.atk-=m.tmp;m.tmp=0}});
  s.maxMana=Math.min(10,s.maxMana+1);s.mana=s.maxMana;s.powerUsed=false;
  s.board.forEach(m=>{m.sleep=false;m.attacked=!!m.frozen});
  // Whoever goes first skips the draw on the opening turn (offsets the first-player advantage).
  if(S.opened)draw(side,1);else S.opened=true;
}
function draw(side,n){
  const s=S[side];
  for(let i=0;i<n;i++){
    if(!s.deck.length){s.fat++;damage(s,s.fat);const f=s.fat;say('fatigue',()=>heroName(s),f);continue}
    const k=s.deck.pop();
    if(s.hand.length>=10){if(side==='p')say('handFull',()=>cn(k))}else{s.hand.push(k);if(side==='p')S.drew++}
  }
}
function summon(side,key){
  const s=S[side];if(s.board.length>=BOARD_MAX)return null;
  const c=CARDS[key];
  const m={uid:++U,key,side,atk:c.a,hp:c.h,max:c.h,base:[c.a,c.h],guard:!!c.guard,ward:!!c.ward,sleep:!c.surge,attacked:false,frozen:false,silenced:false,tmp:0,enter:true};
  s.board.push(m);return m;
}
function damage(o,n){
  if(n<=0)return;
  if(isHero(o)){const a=Math.min(o.armor,n);o.armor-=a;n-=a;o.hp-=n;float(o,n?'-'+n:T('fArmor',a),n?'var(--blood)':'#aab',true)}
  else if(o.ward){o.ward=false;float(o,T('fWard'),'var(--foam)',true)}
  else{o.hp-=n;float(o,'-'+n,'var(--blood)',true)}
}
function canAttack(m){return S.turn===m.side&&!m.sleep&&!m.attacked&&m.atk>0}
function attackTargets(side){
  const op=S[other(side)],guards=op.board.filter(m=>m.guard);
  return guards.length?guards:[op,...op.board];
}
function targetsFor(side,tgt,cond){
  const op=S[other(side)];
  let v=[];
  if(tgt==='any')v=[S.e,S.p,...S.e.board,...S.p.board];
  else if(tgt==='minion')v=[...S.e.board,...S.p.board];
  else if(tgt==='ally')v=S[side].board;
  else if(tgt==='friend')v=[S[side],...S[side].board];
  else if(tgt==='enemy')v=[op,...op.board];
  else if(tgt==='foe')v=op.board;
  return cond?v.filter(o=>!isHero(o)&&(cond==='damaged'?o.hp<o.max:cond==='atk<=3'?o.atk<=3:o.atk>=5)):v;
}
function applyFx(side,fx,t,bonus=0){
  const me=S[side],op=S[other(side)],mt=t&&!isHero(t)?t:null;
  if(fx.selfDmg)damage(me,fx.selfDmg);
  let dmg=fx.dmg||0;
  if(fx.dmgBeast&&me.board.some(m=>CARDS[m.key].race==='beast'))dmg=fx.dmgBeast;
  if(fx.armorDmg)dmg=me.armor;
  if((fx.dmg||fx.armorDmg)&&t){damage(t,dmg+bonus);if(fx.drawIfKill&&mt&&mt.hp<=0)draw(side,1)}
  if(mt){
    if(fx.destroy){mt.hp=0;float(mt,T('fDestroy'),'var(--blood)',true)}
    if(fx.silence)silence(mt);
    if(fx.setAtk){mt.atk=fx.setAtk;mt.tmp=0;float(mt,`${fx.setAtk}/${mt.hp}`,'#cfd8dc')}
    if(fx.setHp){mt.hp=mt.max=fx.setHp;float(mt,`${mt.atk}/${fx.setHp}`,'#cfd8dc')}
    if(fx.freeze){mt.frozen=true;float(mt,T('fFreeze'),'var(--foam)')}
    if(fx.tempAtk){mt.atk+=fx.tempAtk;mt.tmp=(mt.tmp||0)+fx.tempAtk;float(mt,T('fAtk',fx.tempAtk),'var(--ready)')}
    if(fx.buff){mt.atk+=fx.buff[0];mt.hp+=fx.buff[1];mt.max+=fx.buff[1];
      float(mt,fx.buff[0]?T('fAtk',fx.buff[0]):T('fHp',fx.buff[1]),'var(--ready)')}
    if(fx.guard)mt.guard=true;
    if(fx.ward){mt.ward=true;if(!fx.buff)float(mt,T('fWard'),'var(--foam)')}
    if(fx.bounce){const o=S[mt.side];ghost(idOf(mt));o.board=o.board.filter(m=>m!==mt);if(o.hand.length<10)o.hand.push(mt.key)}
  }
  if(fx.aoe)[...op.board].forEach(m=>damage(m,fx.aoe+bonus));
  if(fx.face)damage(op,fx.face+bonus);
  if(fx.sweep){[...me.board,...op.board].forEach(m=>damage(m,fx.sweep+bonus));if(fx.heroes){damage(op,fx.sweep+bonus);damage(me,fx.sweep+bonus)}}
  if(fx.freezeAll)op.board.forEach(m=>{m.frozen=true;float(m,T('fFreeze'),'var(--foam)')});
  if(fx.team)me.board.forEach(m=>{m.atk+=fx.team[0];m.hp+=fx.team[1];m.max+=fx.team[1];
    float(m,fx.team[0]?T('fAtk',fx.team[0]):T('fHp',fx.team[1]),'var(--ready)')});
  if(fx.summon)[].concat(fx.summon).forEach(k=>summon(side,k));
  if(fx.perFoe)for(let i=op.board.length;i>0;i--)summon(side,fx.perFoe);
  if(fx.heal){const h=Math.min(fx.heal,me.max-me.hp);me.hp+=h;float(me,'+'+h,'var(--ready)')}
  if(fx.healT&&t){const h=Math.min(fx.healT,t.max-t.hp);t.hp+=h;float(t,'+'+h,'var(--ready)')}
  if(fx.armor){me.armor+=fx.armor;float(me,T('armorN',fx.armor),'#cfd8dc')}
  if(fx.draw)draw(side,fx.draw);
  if(fx.mana)me.mana+=fx.mana;
}
// Silence: the minion loses buffs, keywords and card effects for good.
function silence(m){
  m.silenced=true;m.guard=false;m.ward=false;m.frozen=false;m.tmp=0;
  m.atk=m.base[0];m.max=m.base[1];if(m.hp>m.max)m.hp=m.max;
  float(m,T('fSilence'),'#aab');
}
const spellBonus=side=>S[side].board.reduce((n,m)=>n+(!m.silenced&&CARDS[m.key].sp||0),0);
// A spell: its effect (plus Spell Damage), then "whenever you cast a spell" minions react.
function castSpell(side,k,t){
  applyFx(side,CARDS[k].fx,t,spellBonus(side));
  S[side].board.forEach(m=>{const o=!m.silenced&&CARDS[m.key].onSpell;if(o&&m.hp>0){m.atk+=o[0];m.hp+=o[1];m.max+=o[1];float(m,T('fAtk',o[0]),'var(--ready)')}});
}
// Spells spend banked spell mana first; minions use normal mana only.
const canPay=(side,k)=>CARDS[k].c<=S[side].mana+(CARDS[k].t==='s'?S[side].sm||0:0);
function pay(side,k){
  const s=S[side],c=CARDS[k];
  if(c.t==='s'){const u=Math.min(s.sm||0,c.c);s.sm=(s.sm||0)-u;s.mana-=c.c-u}else s.mana-=c.c;
}
// Visual for an effect, played before the state change.
async function fxAnim(fx,srcSel,t,side){
  if((fx.dmg||fx.armorDmg)&&t)await projectile(srcSel,idOf(t),fx.freeze?'#8fd0ff':'#f39a3a');
  else if((fx.destroy||fx.silence||fx.setAtk||fx.setHp)&&t)await projectile(srcSel,idOf(t),'#c4b4ff');
  else if((fx.buff||fx.healT||fx.tempAtk||fx.ward||fx.bounce)&&t)await projectile(srcSel,idOf(t),'#7fd17f');
  else if(fx.sweep){wave(side);await wave(other(side))}
  else if(fx.freezeAll)await wave(other(side));
  else if(fx.face&&!fx.aoe)await projectile(srcSel,`${other(side)}:h`,'#f39a3a');
  else if(fx.aoe){if(fx.face&&!RM){const e=elOf(`${other(side)}:h`);if(e){const [x,y]=center(e);burst(x,y,'#f39a3a')}}await wave(other(side))}
  else if(fx.heal||fx.armor||fx.team||fx.selfDmg){const e=elOf(`${side}:h`);if(e&&!RM){const [x,y]=center(e);burst(x,y,fx.armor?'#cfd8dc':'#7fd17f');sparks(x,y,4)}}
}
function doAttack(m,t){
  say('attacks',()=>nm(m),()=>nm(t));
  damage(t,m.atk);
  if(!isHero(t))damage(m,t.atk);
  m.attacked=true;
}
function cleanup(){
  // Online games resolve deaths host-side first on both clients so token ids stay in step.
  for(const sd of S.order||['p','e']){
    const s=S[sd],dead=s.board.filter(m=>m.hp<=0);
    if(!dead.length)continue;
    dead.forEach(m=>ghost(idOf(m)));
    s.board=s.board.filter(m=>m.hp>0);
    dead.forEach(m=>{const g=!m.silenced&&CARDS[m.key].gasp;if(g&&summon(sd,g))say('burst',()=>cn(m.key))});
  }
  if(S.sel!=null&&!S.p.board.some(m=>m.uid===S.sel))S.sel=null;
  if(!S.over&&(S.p.hp<=0||S.e.hp<=0)){
    S.over=true;
    const won=S.e.hp<=0&&S.p.hp>0;
    if(won)say('sinks',()=>heroName(S.e));else say('falls');
    const e=elOf(won?'e:h':'p:h');
    if(e&&!RM){const [x,y]=center(e);burst(x,y,'#f3c97a');setTimeout(()=>burst(x,y,'#cf4a3f'),150);sparks(x,y,10)}
    if(S.mode==='quick'){if(won)Q.w++;else Q.l++}
    if(S.mode==='online'){S.result=S.p.hp<=0&&S.e.hp<=0?'draw':won?'win':'lose';if(S.result==='win')O.w++;else if(S.result==='lose')O.l++;O.concedeArm=false}
    const me=S;
    setTimeout(()=>{
      if(S!==me)return;
      if(S.mode==='quick'){view='qresult';render();return}
      if(S.mode==='online'){view='oresult';render();return}
      if(!won)view='lost';
      else if(R.stage===OPP.length-1)view='champ';
      else{view='reward';picks=rollRewards(R.stage)}
      render();
    },1300);
  }
}
function after(){cleanup();netFlush();render()}

// ---------- player actions ----------
function blocked(){return S.turn!=='p'||S.busy||S.over}
async function playHand(i){
  if(blocked()||S.pending)return;
  S.sel=null;
  const k=S.p.hand[i],c=CARDS[k];
  if(!canPay('p',k)){say('noMana');return render()}
  if(c.t==='m'){
    if(S.p.board.length>=BOARD_MAX){say('boardFull');return render()}
    S.busy=true;await flyCard(i,'[data-board="p"]');
    pay('p',k);S.p.hand.splice(i,1);
    const m=summon('p',k),ph=pushHist('p',k,null);say('summon',()=>cn(k));netAct({t:'play',i,k});
    if(c.bc){
      if(c.bc.tgt){const v=targetsFor('p',c.bc.tgt,c.bc.cond).map(idOf).filter(id=>id!==idOf(m));if(v.length)S.pending={type:'bc',fx:c.bc,valid:v,key:k,src:idOf(m),hist:ph}}
      else{render();await fxAnim(c.bc,`[data-t="${idOf(m)}"]`,null,'p');applyFx('p',c.bc,null)}
    }
    S.busy=false;return after();
  }
  if(c.fx.tgt){
    const v=targetsFor('p',c.fx.tgt,c.fx.cond).map(idOf);
    if(!v.length){say('noTargets');return render()}
    S.pending={type:'spell',idx:i,valid:v,key:k};return render();
  }
  S.busy=true;await flyCard(i,c.fx.aoe?'[data-board="e"]':'[data-t="p:h"]');
  pay('p',k);S.p.hand.splice(i,1);render();
  await fxAnim(c.fx,'[data-t="p:h"]',null,'p');
  castSpell('p',k,null);pushHist('p',k,null);say('cast',()=>cn(k));netAct({t:'cast',i,k,tgt:null});S.busy=false;after();
}
async function usePower(){
  if(powerBlocked()){say('cantPower');return render()}
  const p=curPower();S.sel=null;
  if(p.tgt){S.pending={type:'power',valid:targetsFor('p',p.tgt).map(idOf),key:null};return render()}
  S.busy=true;render();
  await fxAnim(p.fx,'[data-go="power"]',null,'p');
  S.p.mana-=p.c;S.p.powerUsed=true;applyFx('p',p.fx,null);say('powerUse',()=>pn(p),null);netAct({t:'power',tgt:null});
  S.busy=false;after();
}
function pendingLabel(){return S.pending.key?cn(S.pending.key):pn(curPower())}
async function resolvePending(t){
  const p=S.pending;S.pending=null;S.busy=true;render();
  if(p.type==='spell'){
    const k=S.p.hand[p.idx],c=CARDS[k];
    await flyCard(p.idx,`[data-t="${idOf(t)}"]`);
    pay('p',k);S.p.hand.splice(p.idx,1);render();
    await fxAnim(c.fx,'[data-t="p:h"]',t,'p');
    castSpell('p',k,t);pushHist('p',k,t);say('castOn',()=>cn(k),()=>nm(t));netAct({t:'cast',i:p.idx,k,tgt:netRef(t)});
  }else if(p.type==='bc'){
    if(p.hist)p.hist.t=t;
    await fxAnim(p.fx,`[data-t="${p.src}"]`,t,'p');applyFx('p',p.fx,t);netAct({t:'bc',tgt:netRef(t)});
  }else if(p.type==='power'){
    const pw=curPower();
    await fxAnim(pw.fx,'[data-go="power"]',t,'p');
    S.p.mana-=pw.c;S.p.powerUsed=true;applyFx('p',pw.fx,t);say('powerUse',()=>pn(pw),()=>nm(t));netAct({t:'power',tgt:netRef(t)});
  }
  S.busy=false;after();
}
async function clickTarget(id){
  if(blocked())return;
  const o=getObj(id);if(!o)return;
  if(S.pending){if(S.pending.valid.includes(id))resolvePending(o);return}
  if(S.sel!=null){
    const m=S.p.board.find(x=>x.uid===S.sel);
    if(m&&attackTargets('p').map(idOf).includes(id)){
      S.sel=null;S.busy=true;render();await lunge(idOf(m),id);doAttack(m,o);netAct({t:'atk',a:m.uid,tgt:netRef(o)});S.busy=false;return after();
    }
    if(o.side==='e'){say('guardWay');return render()}
  }
  if(o.side==='p'&&!isHero(o)){
    if(canAttack(o)){S.sel=S.sel===o.uid?null:o.uid;if(S.sel)say('ready',()=>nm(o));else S.log=null}
    else say(o.attacked?'already':o.atk<=0?'noAtk':'nextTurn',()=>nm(o));
    return render();
  }
  if(o.side==='e'&&!isHero(o)){say('info',()=>nm(o),o.atk,o.hp,()=>ct(o.key));return render()}
  S.sel=null;render();
}
function endTurn(){
  if(blocked())return;
  S.pending=null;S.sel=null;
  if(S.mode==='online'){
    netAct({t:'end'});S.turn='e';S.round++;startTurn('e');say('eTurn',()=>heroName(S.e));
    cleanup();netFlush();render();banner(T('bannerFoe'),true);return;
  }
  S.turn='e';aiTurn();
}

// ---------- AI ----------
const aiEasy=()=>S.mode==='quick'&&S.diff==='easy';
function aiDamageTarget(n,tgt){
  const foes=S.p.board;
  if(aiEasy()&&Math.random()<.5){const o=tgt==='minion'?foes:[S.p,...foes];return o.length?o[Math.random()*o.length|0]:null}
  const kill=foes.filter(m=>!m.ward&&m.hp<=n).sort((a,b)=>b.atk-a.atk)[0];
  if(kill)return kill;
  const ward=foes.filter(m=>m.ward).sort((a,b)=>b.atk-a.atk)[0];
  if(ward&&n<=2)return ward;
  if(tgt==='any')return S.p;
  if(tgt==='minion')return foes.slice().sort((a,b)=>b.atk-a.atk)[0]||null;
  return null;
}
async function aiPower(){
  const e=S.e,p=e.power,fx=p.fx;if(aiEasy()||e.mana<p.c)return;
  let t=null;
  if(fx.dmg){t=aiDamageTarget(fx.dmg,p.tgt);if(!t)return}
  else if(fx.healT){t=[e,...e.board].filter(x=>x.hp<x.max).sort((a,b)=>(b.max-b.hp)-(a.max-a.hp))[0];if(!t)return}
  else if(fx.buff){t=aiBestAlly();if(!t)return}
  else if(!aiWorth(fx))return;
  e.mana-=p.c;
  if(t)await aimAt(t);
  await fxAnim(fx,'[data-epow]',t,'e');applyFx('e',fx,t);
  say('ePower',()=>heroName(e),()=>pn(p),t?()=>nm(t):null);cleanup();render();await wait(600);
}
function aiBestAlly(){return [...S.e.board].sort((a,b)=>b.atk-a.atk)[0]||null}
function aiWorth(fx){
  const e=S.e,p=S.p;
  if(fx.selfDmg&&e.hp<=12)return false;
  if(fx.draw&&e.hand.length>7)return false;
  if(fx.aoe&&!fx.face&&p.board.length<2)return false;
  if(fx.team&&e.board.length<2)return false;
  if(fx.summon&&e.board.length>=BOARD_MAX)return false;
  if(fx.heal&&!fx.aoe&&!fx.armor&&e.hp>e.max-6)return false;
  if(fx.mana)return e.hand.some(k=>CARDS[k].c===e.mana+fx.mana&&k!=='coin');
  if(fx.summon&&fx.selfDmg&&e.hp<=fx.selfDmg+8)return false;
  return true;
}
const val=m=>m.atk+m.hp+(m.guard?2:0)+(m.ward?2:0);
// An enemy minion worth silencing: buffed, keyworded or carrying an effect.
function aiSilenceTarget(){
  return S.p.board.filter(m=>!m.silenced&&(m.guard||m.ward||m.atk>m.base[0]||m.max>m.base[1]||CARDS[m.key].gasp||CARDS[m.key].sp||CARDS[m.key].onSpell))
    .sort((a,b)=>val(b)-val(a))[0]||null;
}
function aiPlan(k){
  const c=CARDS[k],e=S.e,foes=S.p.board;
  if(c.t==='m'){
    if(e.board.length>=BOARD_MAX)return null;
    const bc=c.bc;
    if(bc&&bc.silence)return {t:aiSilenceTarget()};
    if(bc&&bc.tgt==='ally')return {t:aiBestAlly()};
    if(bc&&bc.tgt)return {t:aiDamageTarget(bc.dmg,bc.tgt)};
    return {t:null};
  }
  const fx=c.fx,bonus=spellBonus('e');
  const pick=(list,score)=>list.slice().sort((a,b)=>score(b)-score(a))[0]||null;
  if(fx.destroy){const t=pick(targetsFor('e',fx.tgt,fx.cond),val);return t&&val(t)>=(c.c>=3?8:5)?{t}:null}
  if(fx.silence){const t=aiSilenceTarget();return t?{t}:null}
  if(fx.setAtk){const t=pick(foes.filter(m=>m.atk>=4),m=>m.atk);return t?{t}:null}
  if(fx.setHp){const t=pick(foes.filter(m=>m.hp>=5),m=>m.hp);return t?{t}:null}
  if(fx.freezeAll)return foes.filter(m=>m.atk>=2).length>=2?{t:null}:null;
  if(fx.aoe&&!fx.face&&foes.length<2&&!foes.some(m=>!m.ward&&m.hp<=fx.aoe+bonus))return null;
  if(fx.aoe&&fx.face&&fx.aoe<3&&!foes.some(m=>!m.ward&&m.hp<=fx.aoe+bonus)&&foes.length<2&&S.p.hp>fx.face+bonus)return null;
  if(fx.sweep){
    const n=fx.sweep+bonus,dies=l=>l.filter(m=>!m.ward&&m.hp<=n).reduce((s,m)=>s+val(m),0);
    if(fx.heroes&&e.hp+e.armor<=n+6)return null;
    return dies(foes)>=dies(e.board)+5?{t:null}:null;
  }
  if(fx.armorDmg){if(e.armor+bonus<2)return null;const t=aiDamageTarget(e.armor+bonus,'minion');return t?{t}:null}
  if(fx.drawIfKill){const t=pick(foes.filter(m=>!m.ward&&m.hp<=fx.dmg+bonus),m=>m.atk);return t?{t}:null}
  if(fx.dmg&&fx.buff){const t=pick(e.board.filter(m=>(m.hp>fx.dmg||m.ward)&&!m.frozen),m=>m.atk);return t?{t}:null}
  if(fx.tempAtk){const t=pick(e.board.filter(m=>!m.sleep&&!m.attacked&&!m.frozen),m=>m.atk);return t?{t}:null}
  if(fx.bounce){const t=pick(e.board.filter(m=>CARDS[m.key].bc&&!CARDS[m.key].token&&m.hp*2<=m.max),m=>CARDS[m.key].c);return t?{t}:null}
  if(fx.perFoe)return foes.length>=2&&e.board.length<BOARD_MAX?{t:null}:null;
  if(fx.ward&&fx.tgt){const t=pick(e.board.filter(m=>!m.ward),m=>m.atk);return t?{t}:null}
  if(fx.dmg){
    const n=(fx.dmgBeast&&e.board.some(m=>CARDS[m.key].race==='beast')?fx.dmgBeast:fx.dmg)+bonus;
    if(fx.selfDmg&&e.hp<=fx.selfDmg+8)return null;
    const t=aiDamageTarget(n,fx.tgt);return t?{t}:null;
  }
  if(fx.buff){const t=aiBestAlly();return t?{t}:null}
  return aiWorth(fx)?{t:null}:null;
}
function aiAttackTarget(m){
  const opts=attackTargets('e');
  if(aiEasy()&&Math.random()<.5)return opts[Math.random()*opts.length|0];
  if(S.p.board.some(g=>g.guard))
    return opts.filter(t=>!t.ward&&t.hp<=m.atk).sort((a,b)=>b.atk-a.atk)[0]||opts.slice().sort((a,b)=>a.hp-b.hp)[0];
  const lethal=S.e.board.filter(canAttack).reduce((s,x)=>s+x.atk,0)>=S.p.hp+S.p.armor;
  if(lethal)return S.p;
  const kills=S.p.board.filter(t=>!t.ward&&t.hp<=m.atk);
  const free=kills.filter(t=>t.atk<m.hp).sort((a,b)=>b.atk-a.atk)[0];
  if(free&&free.atk>=2)return free;
  const big=kills.filter(t=>t.atk>=m.atk&&t.atk>=3).sort((a,b)=>b.atk-a.atk)[0];
  if(big)return big;
  return S.p;
}
async function aiTurn(){
  S.busy=true;S.round++;startTurn('e');say('eTurn',()=>heroName(S.e));cleanup();render();banner(T('bannerFoe'),true);await wait(900);
  const e=S.e,en=()=>heroName(e);
  for(let g=0;g<12&&!S.over;g++){
    const opts=e.hand.map((k,i)=>({k,i})).filter(o=>canPay('e',o.k)).sort((a,b)=>CARDS[b.k].c-CARDS[a.k].c);
    let did=false;
    for(const o of opts){
      const plan=aiPlan(o.k);if(!plan)continue;
      const c=CARDS[o.k],k=o.k;let t=plan.t;pay('e',k);e.hand.splice(o.i,1);
      if(c.t==='m'){
        const shown=c.bc&&c.bc.tgt?t:null;
        say('eSummon',en,()=>cn(k));render();
        const sp=showPlay('e',k,shown);await wait(1100);
        const m=summon('e',k);pushHist('e',k,shown);render();
        if(c.bc){
          if(c.bc.tgt==='ally'&&!t)t=m;
          if(c.bc.tgt)await aimAt(t);
          await fxAnim(c.bc,sp.card,t,'e');applyFx('e',c.bc,t);
        }
        sp.close();
      }else{
        if(t)say('eCastOn',en,()=>cn(k),()=>nm(t));else say('eCast',en,()=>cn(k));
        render();
        const sp=showPlay('e',k,t);await wait(1400);
        pushHist('e',k,t);render();
        await aimAt(t);
        await fxAnim(c.fx,sp.card,t,'e');castSpell('e',k,t);
        sp.close();
      }
      did=true;cleanup();render();await wait(500);break;
    }
    if(!did)break;
  }
  if(!S.over)await aiPower();
  for(const m of [...e.board]){
    if(S.over)return;
    if(!e.board.includes(m)||!canAttack(m))continue;
    const t=aiAttackTarget(m);
    await lunge(idOf(m),idOf(t));doAttack(m,t);cleanup();render();await wait(420);
  }
  if(S.over)return;
  S.turn='p';startTurn('p');S.busy=false;say('yourTurnLog');cleanup();render();banner(T('bannerYou'));
}

// ---------- friend match (peer-to-peer, room code) ----------
// Both phones run the same deterministic rules. The host shuffles both decks and picks who goes first;
// after that each side sends only its own moves, and the other side replays them like an opponent turn.
// Every batch carries a state hash; if the two copies ever disagree, the host's copy wins.
const NET_PREFIX='ashen-crown-v1-';
const NET_V=(()=>{let h=0;const s=JSON.stringify(Object.keys(CARDS).map(k=>{const c=CARDS[k];return [k,c.c,c.a,c.h,c.bc,c.fx,c.guard,c.ward,c.surge,c.gasp]}))+JSON.stringify(CLASSES.map(c=>c.power));
  for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h})();
let NET=null;
const O={sel:null,code:'',err:'',toast:'',concedeArm:false,w:0,l:0,lost:null,conceded:false};
function onlineDecks(){
  // Friend matches use your own saved 25-card decks only, so both sides play the same deck size.
  return loadSaved().filter(d=>d.cards.length===DECK_SIZE&&validDeck(d.cards,d.cls)).map(d=>({id:'s:'+d.id,sid:d.id,cls:d.cls,cards:[...d.cards],name:d.name}));
}
function curOnlineDeck(){const l=onlineDecks();return l.find(d=>d.id===O.sel)||l[0]}
function goOnline(){
  if(!O.sel){try{O.sel=localStorage.getItem('ashen-online-deck')}catch(e){}}
  O.err='';O.toast='';view='online';render();scrollTo(0,0);
}
function loadPeerLib(){
  if(window.Peer)return Promise.resolve();
  const tryLoad=src=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;
    s.onload=()=>window.Peer?res():rej();s.onerror=()=>{s.remove();rej()};document.head.appendChild(s)});
  return tryLoad('peerjs.min.js').catch(()=>tryLoad('https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'));
}
function peerOpts(){
  const o={debug:0,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]}};
  // ?peer=host:port points at a self-hosted signalling server (used for local testing).
  try{const ps=new URLSearchParams(location.search).get('peer');if(ps){const [host,port]=ps.split(':');Object.assign(o,{host,port:+port||9000,path:'/',secure:false})}}catch(e){}

async function netStart(host,code){

  render();

  if(NET!==me)return;

      const peer=new Peer(NET_PREFIX+me.code,opts);me.peer=peer;
      peer.on('open',()=>{if(NET!==me)return;me.ready=true;render()});
      peer.on('connection',c=>{if(NET!==me||me.conn){try{c.close()}catch(e){}return}netAttach(c)});
      peer.on('error',err=>{if(NET!==me||me.state==='live')return;
        if(err.type==='unavailable-id'){try{peer.destroy()}catch(e){}me.code=newCode();open();return}
        netFail('errServer')});

      peer.on('disconnected',()=>{if(NET===me&&me.state!=='live'){try{peer.reconnect()}catch(e){}}});
    };

  }else{
    const peer=new Peer(opts);me.peer=peer;
    peer.on('open',()=>{if(NET!==me)return;netAttach(peer.connect(NET_PREFIX+me.code,{reliable:true,serialization:'json'}))});
    peer.on('error',err=>{if(NET!==me||me.state==='live')return;netFail(err.type==='peer-unavailable'?'errNoRoom':'errServer')});

}
function netAttach(c){
  const me=NET;me.conn=c;
  c.on('open',()=>{if(NET!==me)return;clearTimeout(me.to);me.last=Date.now();
    c.send({t:'hello',v:NET_V,cls:me.deck.cls,deck:me.deck.cards});
    me.hb=setInterval(()=>{if(NET!==me)return;netSend({t:'ping'});netWatch()},3000)});
  c.on('data',d=>{if(NET===me)netRecv(d)});
  c.on('close',()=>{if(NET===me)netLost()});
  c.on('error',()=>{if(NET===me)netLost()});
}

function netWatch(){
  const me=NET;if(!me||me.state!=='live')return;
  const idle=Date.now()-me.last;
  if(idle>60000)return netLost();
  const slow=idle>12000&&view==='duel';let el=$('.netwarn');
  if(slow&&!el){el=document.createElement('div');el.className='netwarn';el.setAttribute('role','status');el.textContent=T('netSlow');document.body.appendChild(el)}
  else if(!slow&&el)el.remove();
}
function netRecv(d){
  const me=NET;me.last=Date.now();
  if(!d||typeof d!=='object')return;
  if(d.t==='ping')return netWatch();
  if(d.t==='hello'){
    if(d.v!==NET_V){netSend({t:'err',k:'errVersion'});return netFail('errVersion')}
    const ok=Array.isArray(d.deck)&&d.deck.length>=20&&validDeck(d.deck,d.cls)&&CBY[d.cls];
    if(!ok){netSend({t:'err',k:'errDeck'});return netFail('errDeck')}
    me.foe={cls:d.cls,deck:d.deck};me.state='live';
    if(me.host)netDeal();else render();
    return;
  }
  if(d.t==='err')return netFail(I18N.en[d.k]?d.k:'errServer');
  if(d.t==='start')return startOnline(d);
  if(d.t==='bye')return netLost();
  if(d.t==='again'){me.foeAgain=true;if(me.host&&me.again)netDeal();else if(view==='oresult')render();return}
  if(d.t==='act'||d.t==='sync'||d.t==='needsync'){me.q.push(d);netPump()}
}

// Compact fingerprint of everything both copies must agree on, host's side first.
function netHash(){
  const sd=s=>[s.hp,s.armor,s.mana,s.maxMana,s.sm||0,s.hand,s.deck.length,s.fat,s.powerUsed?1:0,s.board.map(m=>[m.uid,m.key,m.atk,m.hp,m.max,m.guard?1:0,m.ward?1:0,m.sleep?1:0,m.attacked?1:0,m.frozen?1:0,m.silenced?1:0,m.tmp||0])];
  const str=JSON.stringify([S.order.map(k=>sd(S[k])),S.turn===S.order[0]?'h':'g']);
  let x=0;for(let i=0;i<str.length;i++)x=(x*31+str.charCodeAt(i))|0;return x;
}
function netSnap(){
  const side=s=>({hp:s.hp,max:s.max,armor:s.armor,mana:s.mana,maxMana:s.maxMana,sm:s.sm||0,deck:[...s.deck],hand:[...s.hand],fat:s.fat,powerUsed:s.powerUsed,
    board:s.board.map(m=>({uid:m.uid,key:m.key,atk:m.atk,hp:m.hp,max:m.max,base:m.base,guard:m.guard,ward:m.ward,sleep:m.sleep,attacked:m.attacked,frozen:!!m.frozen,silenced:!!m.silenced,tmp:m.tmp||0}))});
  return {h:side(S[S.order[0]]),g:side(S[S.order[1]]),turn:S.turn===S.order[0]?'h':'g',opened:S.opened,U};
}
function netApplySnap(st){
  if(!S||S.mode!=='online'||!NET)return;
  const mine=NET.host?st.h:st.g,theirs=NET.host?st.g:st.h;
  for(const [sd,src] of [['p',mine],['e',theirs]]){
    Object.assign(S[sd],src,{hand:[...src.hand],deck:[...src.deck],board:src.board.map(m=>({...m,side:sd,enter:false}))});
  }
  S.turn=(st.turn==='h')===NET.host?'p':'e';S.opened=st.opened;U=Math.max(U,st.U);
  S.pending=null;S.sel=null;S.busy=false;cleanup();render();
}
function netAct(a){if(S&&S.mode==='online'&&NET)NET.out.push(a)}
function netFlush(){
  if(!S||S.mode!=='online'||!NET||!NET.out.length)return;
  const acts=NET.out;NET.out=[];netSend({t:'act',acts,h:netHash()});
}
const netRef=o=>o?{s:o.side==='p'?'me':'you',u:isHero(o)?null:o.uid}:null;
// Sender's "me" is our 'e'.
const netDeref=r=>{if(!r)return null;const sd=r.s==='me'?'e':'p';return r.u==null?S[sd]:S[sd].board.find(m=>m.uid===r.u)||null};
async function netPump(){
  const me=NET;if(!me||me.qBusy)return;me.qBusy=true;
  while(NET===me&&me.q.length){
    const m=me.q.shift();
    try{
      if(m.t==='needsync'){if(me.host&&S&&S.mode==='online')netSend({t:'sync',st:netSnap()});continue}
      if(m.t==='sync'){netApplySnap(m.st);continue}
      if(!S||S.mode!=='online')continue;
      for(const a of m.acts){if(S.over)break;await remoteAct(a)}
      if(NET===me&&!S.over&&m.h!==netHash()){console.info('[net] state mismatch, resyncing');if(me.host)netSend({t:'sync',st:netSnap()});else netSend({t:'needsync'})}
    }catch(e){
      console.warn('resync',e);S.busy=S.turn!=='p';
      if(NET===me){if(me.host)netSend({t:'sync',st:netSnap()});else netSend({t:'needsync'})}
    }
  }
  me.qBusy=false;
}
async function remoteAct(a){
  const e=S.e,en=()=>heroName(e);
  if(a.t==='concede'){O.conceded=true;e.hp=0;cleanup();render();return}
  if(a.t==='end'){S.turn='p';startTurn('p');S.busy=false;say('yourTurnLog');cleanup();render();banner(T('bannerYou'));return}
  S.busy=true;
  if(a.t==='play'||a.t==='cast'){
    const k=e.hand[a.i];if(k!==a.k)throw new Error('hand out of step');
    const c=CARDS[k];pay('e',k);e.hand.splice(a.i,1);
    if(c.t==='m'){
      say('eSummon',en,()=>cn(k));render();
      const sp=showPlay('e',k,null);await wait(900);
      const m=summon('e',k),hh=pushHist('e',k,null);S.lastE={m,h:hh};render();
      if(c.bc&&!c.bc.tgt){await fxAnim(c.bc,sp.card,null,'e');applyFx('e',c.bc,null)}
      sp.close();
    }else{
      const t=netDeref(a.tgt);if(a.tgt&&!t)throw new Error('target missing');
      if(t)say('eCastOn',en,()=>cn(k),()=>nm(t));else say('eCast',en,()=>cn(k));render();
      const sp=showPlay('e',k,t);await wait(1100);pushHist('e',k,t);render();
      if(t)await aimAt(t);
      await fxAnim(c.fx,sp.card,t,'e');castSpell('e',k,t);sp.close();
    }
  }else if(a.t==='bc'){
    const last=S.lastE,t=netDeref(a.tgt);if(!last||(a.tgt&&!t))throw new Error('battlecry out of step');
    const fx=CARDS[last.m.key].bc;if(t){last.h.t=t;render();await aimAt(t)}
    await fxAnim(fx,`[data-t="${idOf(last.m)}"]`,t,'e');applyFx('e',fx,t);
  }else if(a.t==='power'){
    const p=e.power,t=netDeref(a.tgt);if(a.tgt&&!t)throw new Error('target missing');
    e.mana-=p.c;e.powerUsed=true;
    if(t)await aimAt(t);
    await fxAnim(p.fx,'[data-epow]',t,'e');applyFx('e',p.fx,t);say('ePower',en,()=>pn(p),t?()=>nm(t):null);
  }else if(a.t==='atk'){
    const m=e.board.find(x=>x.uid===a.a),t=netDeref(a.tgt);if(!m||!t)throw new Error('attack out of step');
    say('attacks',()=>nm(m),()=>nm(t));render();
    await lunge(idOf(m),idOf(t));doAttack(m,t);
  }
  cleanup();render();await wait(350);
}
